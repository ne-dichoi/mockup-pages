<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NE능률</title>
<style>
/* ============================================================
   NE능률 메인 상단 — 반응형 단일 마크업
   breakpoint : 1024px (이상 = PC 2단 / 미만 = 모바일 1단)
   ============================================================ */
:root{
  --red:#E63329; --ink:#111214; --gray:#6B7280; --line:#E5E7EB;
  --tint:#EDF2FE; --bg:#FFFFFF; --wrap:1200px; --gnb-h:52px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.5;
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,sans-serif;
  -webkit-text-size-adjust:100%;}
img{max-width:100%;display:block;}
button{font-family:inherit;}
a{color:inherit;}

/* ---------- 헤더 ---------- */
.site-hdr{position:sticky;top:-32px;z-index:100;background:#fff;}
.util{display:flex;align-items:center;justify-content:flex-end;height:32px;padding:0 10px;
  background:#FAFBFC;border-bottom:1px solid #F1F2F4;}
.util-in{display:flex;align-items:center;width:100%;max-width:var(--wrap);margin:0 auto;
  justify-content:flex-end;}
.u-left{display:none;font-size:11.5px;font-weight:700;color:#6B7280;margin-right:auto;
  align-items:center;gap:5px;cursor:pointer;}
.u-left b{color:#B0B6BF;}
.u-right{display:flex;align-items:center;}
.u-right a{font-size:11px;font-weight:600;color:#6B7280;text-decoration:none;padding:0 7px;
  letter-spacing:-.45px;white-space:nowrap;position:relative;}
.u-right a+a::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:1px;height:9px;background:#E1E4E9;}
.u-right a.em{color:var(--red);font-weight:800;}
.gnb{height:var(--gnb-h);border-bottom:1px solid var(--line);background:#fff;}
.gnb-in{display:flex;align-items:center;height:100%;padding:0 8px;max-width:var(--wrap);margin:0 auto;}
.logo{font-size:17px;font-weight:900;color:var(--red);letter-spacing:-.5px;padding:0 6px;text-decoration:none;}
.gmenu{display:none;margin-left:20px;}
.gmenu a{font-size:14.5px;font-weight:700;color:#374151;text-decoration:none;padding:0 13px;letter-spacing:-.4px;}
.gmenu a.on{color:var(--red);}
.sp{flex:1;}
.ibtn{width:40px;height:40px;display:grid;place-items:center;border:0;background:none;cursor:pointer;padding:0;}
.ibtn svg{width:21px;height:21px;stroke:#111;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.ibtn.my{display:none;}

/* ---------- 상단 섹션 ---------- */
.topsec{background:#fff;}
.inner{display:flex;flex-direction:column;max-width:var(--wrap);margin:0 auto;}
.cat,.cat-body{display:contents;}          /* 모바일: 래퍼 투명화 → order로 재배치 */
.cat-h{display:none;}
.g-subj{order:1;} .panel{order:2;} .g-promo{order:3;} .pdots{order:4;}

/* 과목 3 = 상단 탭 */
.g-subj{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);
  position:sticky;top:var(--gnb-h);z-index:50;background:#fff;border-bottom:1px solid var(--line);}
.g-subj button{width:100%;min-height:48px;border:0;background:none;cursor:pointer;position:relative;
  font-size:14.5px;font-weight:700;color:#9AA1AC;letter-spacing:-.4px;
  display:flex;align-items:center;justify-content:center;gap:6px;transition:color .15s;}
.g-subj button i{display:none;}
.g-subj button.on{color:var(--ink);font-weight:800;}
.g-subj button.on::after{content:"";position:absolute;left:14%;right:14%;bottom:-1px;height:3px;
  background:var(--red);border-radius:2px 2px 0 0;}

/* 프로모션 2 = 롤링 배너 */
.g-promo{list-style:none;margin:18px 0 0;padding:0 16px;display:flex;gap:10px;
  overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:16px;scrollbar-width:none;}
.g-promo::-webkit-scrollbar{display:none;}
.g-promo li{flex:0 0 100%;scroll-snap-align:start;}
.g-promo button{width:100%;min-height:164px;border:0;border-radius:14px;cursor:pointer;position:relative;
  overflow:hidden;padding:20px 18px;display:flex;flex-direction:column;align-items:flex-start;
  justify-content:center;text-align:left;color:#fff;}
.g-promo .lab{font-size:11px;font-weight:800;padding:4px 10px;border-radius:11px;margin-bottom:9px;}
.g-promo .nm{font-size:21px;font-weight:900;letter-spacing:-.8px;line-height:1.25;margin-bottom:7px;}
.g-promo .cp{font-size:12.5px;letter-spacing:-.3px;margin-bottom:13px;line-height:1.45;}
.g-promo .go{font-size:12.5px;font-weight:800;background:rgba(255,255,255,.16);padding:8px 14px;border-radius:20px;}
.g-promo .art{position:absolute;right:2px;bottom:-6px;font-size:86px;line-height:1;opacity:.92;}
.g-promo button i{display:none;}
.bn-seminar{background:linear-gradient(115deg,#1E2637,#3A4A66);}
.bn-seminar .lab{background:rgba(255,255,255,.16);} .bn-seminar .cp{color:rgba(255,255,255,.74);} .bn-seminar .go{color:#FFC96B;}
.bn-pre{background:linear-gradient(115deg,#E63329,#FF7F52);}
.bn-pre .lab{background:rgba(255,255,255,.2);} .bn-pre .cp{color:rgba(255,255,255,.86);} .bn-pre .go{color:#fff;}
.pdots{display:flex;justify-content:center;gap:5px;padding:11px 0 4px;}
.pdots i{width:5px;height:5px;border-radius:3px;background:#D2D6DD;transition:.2s;cursor:pointer;}
.pdots i.on{width:16px;background:var(--red);}

/* 패널 */
.panel{background:var(--tint);padding:20px 0;}
.pad{padding:0 16px;}
.pane{display:none;} .pane.on{display:block;}
.eyebrow{font-size:12px;font-weight:800;color:var(--red);letter-spacing:-.3px;margin-bottom:7px;}
.headline{font-size:24px;font-weight:900;letter-spacing:-1px;line-height:1.28;margin:0 0 7px;}
.desc{font-size:13px;color:#4B5563;letter-spacing:-.3px;margin:0;}
.allview{display:none;margin-top:15px;font-size:13px;font-weight:800;text-decoration:none;}
.allview i{font-style:normal;color:var(--red);}
.tabwrap{position:relative;margin-top:16px;}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 16px;scrollbar-width:none;
  scroll-snap-type:x proximity;scroll-padding-inline:16px;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:0 0 auto;height:36px;padding:0 15px;border-radius:18px;border:1px solid #D5DCE8;background:#fff;
  font-size:12.5px;font-weight:700;color:#4B5563;letter-spacing:-.3px;cursor:pointer;white-space:nowrap;
  scroll-snap-align:start;transition:.15s;}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff;}
.fade{position:absolute;top:0;bottom:0;right:0;width:24px;pointer-events:none;
  background:linear-gradient(90deg,rgba(237,242,254,0),var(--tint));}

/* 교재 캐러셀 */
.rail{display:flex;gap:9px;overflow-x:auto;padding:14px 16px 4px;scroll-snap-type:x mandatory;
  scrollbar-width:none;scroll-padding-inline:16px;}
.rail::-webkit-scrollbar{display:none;}
.card{flex:0 0 30.5%;scroll-snap-align:start;cursor:pointer;}
.thumb{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;padding:8px 7px;
  display:flex;flex-direction:column;box-shadow:0 4px 12px rgba(17,18,20,.16);}
.thumb .kicker{font-size:8.5px;font-weight:900;color:#fff;line-height:1.15;text-shadow:0 1px 2px rgba(0,0,0,.28);}
.thumb .face{font-size:26px;text-align:center;margin:auto;}
.cart{position:absolute;right:5px;bottom:5px;width:22px;height:22px;border-radius:50%;
  background:rgba(255,255,255,.95);display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.2);}
.cart svg{width:11px;height:11px;stroke:#111;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.cap{font-size:11px;font-weight:600;color:#374151;text-align:center;margin-top:6px;letter-spacing:-.3px;}
.more{flex:0 0 30.5%;scroll-snap-align:start;}
.more .box{aspect-ratio:3/4;border-radius:10px;border:1px dashed #B9C4D8;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:5px;color:#5A6478;font-size:11px;font-weight:700;}
.more .circle{width:28px;height:28px;border-radius:50%;background:#fff;display:grid;place-items:center;
  font-size:13px;color:var(--red);font-weight:900;box-shadow:0 2px 6px rgba(0,0,0,.08);}
.prog{height:3px;border-radius:2px;background:#D8E0F2;margin:13px 16px 0;overflow:hidden;}
.prog i{display:block;height:100%;background:#8FA3CC;border-radius:2px;}

/* PC 전용 : 프로모션 선택 시 우측 패널 배너 */
.bigbanner{margin:0 16px;border-radius:14px;overflow:hidden;position:relative;min-height:200px;
  padding:24px 20px;display:flex;flex-direction:column;justify-content:center;}
.bigbanner .lab{font-size:11px;font-weight:800;padding:4px 10px;border-radius:11px;align-self:flex-start;
  margin-bottom:10px;color:#fff;background:rgba(255,255,255,.18);}
.bigbanner h3{margin:0 0 8px;font-size:24px;font-weight:900;letter-spacing:-.9px;color:#fff;}
.bigbanner p{margin:0 0 15px;font-size:13px;color:rgba(255,255,255,.82);}
.bigbanner .go{font-size:13px;font-weight:800;align-self:flex-start;background:rgba(255,255,255,.16);
  padding:9px 16px;border-radius:22px;color:#fff;}
.bigbanner .art{position:absolute;right:14px;bottom:-8px;font-size:112px;line-height:1;opacity:.92;}

/* ---------- 다음 섹션 / 푸터 ---------- */
.sec{max-width:var(--wrap);margin:0 auto;padding:26px 0 10px;}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;padding:0 16px 12px;}
.sec-h h2{margin:0;font-size:17px;font-weight:900;letter-spacing:-.6px;}
.sec-h a{font-size:12px;color:var(--gray);text-decoration:none;font-weight:600;}
.foot{margin-top:34px;background:#F7F8FA;border-top:1px solid var(--line);padding:24px 16px 40px;}
.foot-in{max-width:var(--wrap);margin:0 auto;}
.flinks{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:14px;}
.flinks a{font-size:12px;font-weight:700;color:#4B5563;text-decoration:none;}
.fcopy{font-size:11.5px;color:#9AA1AC;line-height:1.7;}

/* ---------- 뷰포트 표시(테스트용) ---------- */
#vp{position:fixed;right:12px;bottom:12px;z-index:999;background:rgba(17,18,20,.86);color:#fff;
  font-size:11px;font-weight:700;padding:7px 10px;border-radius:999px;display:flex;align-items:center;gap:8px;
  letter-spacing:-.2px;backdrop-filter:blur(4px);}
#vp b{color:#FFC96B;}
#vp span{cursor:pointer;opacity:.6;padding-left:2px;}

/* ============================================================
   PC : 1024px 이상
   ============================================================ */
@media (min-width:1024px){
  :root{--gnb-h:66px;}
  .site-hdr{top:-36px;}
  .util{height:36px;padding:0 24px;}
  .u-left{display:flex;}
  .u-right a{font-size:12px;padding:0 10px;}
  .gnb-in{padding:0 24px;}
  .menu{display:none;}
  .logo{font-size:20px;padding-left:0;}
  .gmenu{display:flex;}
  .ibtn.my{display:grid;}

  .inner{display:grid;grid-template-columns:296px 1fr;gap:24px;padding:24px;align-items:start;}
  .cat{display:block;}
  .cat-body{display:block;margin-top:8px;background:#fff;border:1px solid var(--line);
    border-radius:12px;padding:6px;}
  .cat-h{display:flex;align-items:center;gap:7px;background:var(--ink);color:#fff;border-radius:10px;
    padding:11px 14px;font-size:13.5px;font-weight:800;letter-spacing:-.3px;}
  .cat-h .dot{width:5px;height:5px;border-radius:50%;background:var(--red);flex:none;}
  .pdots{display:none;}

  .g-subj,.g-promo{display:block;margin:0;padding:0;overflow:visible;position:static;border:0;background:none;}
  .g-subj button,.g-promo button{display:flex;flex-direction:row;align-items:center;width:100%;
    min-height:46px;border-radius:8px;background:none;color:#374151;padding:0 12px;
    font-size:15px;font-weight:700;letter-spacing:-.4px;text-align:left;justify-content:flex-start;}
  .g-subj button i,.g-promo button i{display:block;font-style:normal;font-size:11px;color:#C4C7CC;margin-left:auto;}
  .g-subj button.on{background:var(--red);color:#fff;font-weight:800;}
  .g-subj button.on::after{display:none;}
  .g-promo{border-top:1px solid #F1F2F4;margin-top:5px;padding-top:5px;}
  .g-promo button{color:#B4471F;gap:7px;}
  .g-promo button::before{content:"";width:5px;height:5px;border-radius:50%;background:#FF7A38;flex:none;}
  .g-promo button.on{background:#B4471F;color:#fff;}
  .g-promo button.on::before{background:#FFC96B;}
  .g-promo .lab,.g-promo .cp,.g-promo .go,.g-promo .art{display:none;}
  .g-promo .nm{font-size:15px;font-weight:700;letter-spacing:-.4px;margin:0;}

  .panel{border-radius:14px;min-height:344px;padding:30px 0;display:flex;flex-direction:column;justify-content:center;}
  .pad{padding:0;}
  .pane.series.on{display:grid;grid-template-columns:minmax(210px,.72fr) 1.55fr;gap:26px;
    align-items:center;padding:0 30px;}
  .headline{font-size:30px;letter-spacing:-1.2px;}
  .desc{font-size:14px;}
  .allview{display:inline-block;}
  .tabwrap{margin-top:0;}
  .tabs{padding:0;overflow:visible;justify-content:flex-end;flex-wrap:nowrap;gap:5px;}
  .tab{height:32px;padding:0 12px;font-size:12px;}
  .fade{display:none;}
  .rail{padding:16px 0 0;overflow:visible;}
  .card{flex:1 1 0;}
  .thumb{padding:10px 9px;} .thumb .kicker{font-size:9.5px;} .thumb .face{font-size:34px;}
  .cap{font-size:12px;}
  .more,.prog{display:none;}
  .bigbanner{margin:0 30px;min-height:250px;padding:30px 34px;}
  .bigbanner h3{font-size:30px;}
  .bigbanner p{font-size:14px;}
  .bigbanner .art{font-size:130px;right:24px;}

  .sec{padding:36px 24px 10px;}
  .sec-h{padding:0 0 14px;}
  .sec-h h2{font-size:20px;}
  .sec .rail{padding:0;gap:16px;}
  .sec .card{flex:1 1 0;max-width:176px;}
  .foot{padding:30px 24px 56px;}
}

/* 태블릿 : 교재를 4장씩 */
@media (min-width:640px) and (max-width:1023px){
  .card,.more{flex-basis:22.5%;}
  .g-promo li{flex-basis:calc(50% - 5px);}
  .g-promo button{min-height:180px;}
  .headline{font-size:28px;}
  .panel{padding:26px 0;}
  .pad{padding:0 24px;}
  .tabs,.rail{padding-inline:24px;scroll-padding-inline:24px;}
  .g-promo{padding-inline:24px;scroll-padding-inline:24px;}
  .prog{margin-inline:24px;}
}
</style>
</head>
<body>

<header class="site-hdr">
  <div class="util">
    <div class="util-in">
      <span class="u-left">NE능률 그룹사이트 <b>▾</b></span>
      <nav class="u-right">
        <a href="#">로그인</a><a href="#">회원가입</a><a href="#">주문조회</a>
        <a href="#">고객센터</a><a href="#" class="em">교사·강사</a>
      </nav>
    </div>
  </div>
  <div class="gnb">
    <div class="gnb-in">
      <button class="ibtn menu" aria-label="전체메뉴"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <a href="#" class="logo">NE능률</a>
      <nav class="gmenu">
        <a href="#" class="on">교재</a><a href="#">브랜드</a><a href="#">학습자료</a><a href="#">이벤트</a><a href="#">고객지원</a>
      </nav>
      <span class="sp"></span>
      <button class="ibtn" aria-label="검색"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
      <button class="ibtn" aria-label="장바구니"><svg viewBox="0 0 24 24"><path d="M5 6h15l-1.5 9h-12z"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg></button>
      <button class="ibtn my" aria-label="마이페이지"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M4.5 20c1.3-3.8 4.2-5.6 7.5-5.6s6.2 1.8 7.5 5.6"/></svg></button>
    </div>
  </div>
</header>

<main>
  <section class="topsec">
    <div class="inner">
      <aside class="cat">
        <div class="cat-h"><span class="dot"></span>카테고리로 빠르게 확인!</div>
        <div class="cat-body">
          <ul class="g-subj">
            <li><button class="on" data-k="ELT">ELT<i>›</i></button></li>
            <li><button data-k="초/중등 영어">초·중등 영어<i>›</i></button></li>
            <li><button data-k="고등 영어">고등 영어<i>›</i></button></li>
          </ul>
          <!-- 프로모션 : 같은 li가 PC=목록 행, 모바일=롤링 배너
               .nm  → PC 목록 텍스트 (모바일에선 배너 제목)
               .lab/.cp/.go/.art → 모바일 배너 전용 (PC에서 display:none)
               실제 적용 시 .art 자리에 모바일 시안 이미지,
               PC 배너 시안이 따로 있으면 .pc-art 를 추가해 반대로 노출 -->
          <ul class="g-promo">
            <li><button class="bn-seminar" data-k="혼강 세미나">
              <span class="lab">교사·강사</span>
              <span class="nm">혼강 세미나</span>
              <span class="cp">혼자 강의 준비, 막막하지 않게.<br>현장 교사와 함께하는 수업 설계.</span>
              <span class="go">일정 보기 ›</span><span class="art">🎤</span><i>›</i>
            </button></li>
            <li><button class="bn-pre" data-k="예비 중등 추천">
              <span class="lab">초6 학부모</span>
              <span class="nm">예비 중등 추천</span>
              <span class="cp">중학교 가기 전, 딱 이만큼.<br>겨울방학 8주 완성 코스.</span>
              <span class="go">추천 코스 보기 ›</span><span class="art">⭐</span><i>›</i>
            </button></li>
          </ul>
        </div>
      </aside>

      <div class="panel">
        <div class="pane series on">
          <div class="pad ptxt">
            <div class="eyebrow"></div>
            <h2 class="headline"></h2>
            <p class="desc"></p>
            <a class="allview" href="#">전체 보기 <i>›</i></a>
          </div>
          <div class="pgood">
            <div class="tabwrap"><div class="tabs"></div><div class="fade"></div></div>
            <div class="rail"></div>
            <div class="prog"><i></i></div>
          </div>
        </div>
        <div class="pane promo"></div>
      </div>

      <div class="pdots"></div>
    </div>
  </section>

  <section class="sec">
    <div class="sec-h"><h2>이번 주 베스트</h2><a href="#">더보기 ›</a></div>
    <div class="rail" id="bestRail"></div>
  </section>
</main>

<footer class="foot">
  <div class="foot-in">
    <div class="flinks">
      <a href="#">회사소개</a><a href="#">이용약관</a><a href="#">개인정보처리방침</a>
      <a href="#">고객센터</a><a href="#">채용</a>
    </div>
    <p class="fcopy">
      (주)NE능률 · 서울특별시 강남구 논현로 · 대표전화 1588-0000<br>
      © NE Neungyule, Inc. All rights reserved.
    </p>
  </div>
</footer>

<div id="vp"><span class="t">— px · —</span><span class="x" title="숨기기">✕</span></div>

<script>
const S=(c,f,t)=>[c,f,t];
const CAT={
 "ELT":{eb:"ELT · 파닉스부터 독해까지",hl:"처음 영어,<br>흥미를 잃지 않게",
  ds:"파닉스→리딩으로 이어지는 단계별 코스.<br>우리 아이 레벨에 맞는 시리즈를 확인하세요.",
  series:{
   "Bricks Reading":[S("#4CAF50","🦝","Bricks Reading 30"),S("#F5A623","🐱","Bricks Reading 50"),S("#E63329","🐰","Bricks Reading 70"),S("#2E9BD6","🐧","Bricks Reading 100"),S("#5B3FA8","🦉","Bricks Reading 150")],
   "Phonics Code":[S("#E63329","🦊","Phonics Code 1"),S("#F5A623","🐻","Phonics Code 2"),S("#2E9BD6","🐳","Phonics Code 3"),S("#4CAF50","🐢","Phonics Code 4"),S("#5B3FA8","🦁","Phonics Code 5")],
   "주니어 리딩튜터":[S("#2E9BD6","📘","주니어 리딩튜터 1"),S("#4CAF50","📗","주니어 리딩튜터 2"),S("#F5A623","📙","주니어 리딩튜터 3"),S("#E63329","📕","주니어 리딩튜터 4"),S("#5B3FA8","📓","주니어 리딩튜터 5")],
   "능률VOCA 초등":[S("#5B3FA8","🔤","능률VOCA 초등 1"),S("#2E9BD6","🔡","능률VOCA 초등 2"),S("#4CAF50","✏️","능률VOCA 초등 3"),S("#F5A623","📝","능률VOCA 초등 4"),S("#E63329","🎓","능률VOCA 초등 5")]}},
 "초/중등 영어":{eb:"초·중등 영어 · 내신부터 서술형까지",hl:"학교 시험,<br>흔들리지 않게",
  ds:"학년별 교과 흐름에 맞춘 문법·독해 코스.",
  series:{
   "그래머 존":[S("#2E9BD6","📘","그래머 존 입문"),S("#4CAF50","📗","그래머 존 기본 1"),S("#F5A623","📙","그래머 존 기본 2"),S("#E63329","📕","그래머 존 종합"),S("#5B3FA8","📓","그래머 존 워크북")],
   "리딩튜터":[S("#4CAF50","📗","리딩튜터 입문"),S("#2E9BD6","📘","리딩튜터 기본"),S("#F5A623","📙","리딩튜터 실력"),S("#E63329","📕","리딩튜터 수능"),S("#5B3FA8","📓","리딩튜터 완성")],
   "능률VOCA 중등":[S("#5B3FA8","🔤","중등VOCA 실력"),S("#2E9BD6","🔡","중등VOCA 심화"),S("#4CAF50","✏️","중등VOCA 어원"),S("#F5A623","📝","중등VOCA 필수"),S("#E63329","🎓","중등VOCA 총정리")]}},
 "고등 영어":{eb:"고등 영어 · 수능까지 한 번에",hl:"수능 실전,<br>한 권씩 끝내기",
  ds:"기출 분석 기반 유형서와 실전 모의고사.",
  series:{
   "빠른독해 바른독해":[S("#E63329","📕","빠바 기초편"),S("#F5A623","📙","빠바 구문편"),S("#2E9BD6","📘","빠바 유형편"),S("#4CAF50","📗","빠바 완성편"),S("#5B3FA8","📓","빠바 실전편")],
   "수능만만":[S("#2E9BD6","📘","수능만만 독해"),S("#4CAF50","📗","수능만만 어법"),S("#F5A623","📙","수능만만 듣기"),S("#E63329","📕","수능만만 실전"),S("#5B3FA8","📓","수능만만 파이널")],
   "능률VOCA 수능":[S("#5B3FA8","🔤","수능VOCA 어원"),S("#2E9BD6","🔡","수능VOCA 실력"),S("#4CAF50","✏️","수능VOCA 필수"),S("#F5A623","📝","수능VOCA 심화"),S("#E63329","🎓","수능VOCA 총정리")]}}
};
const PROMO={
 "혼강 세미나":{cls:"bn-seminar",lab:"교사·강사",title:"혼강 세미나",
   copy:"혼자 강의 준비, 막막하지 않게.<br>현장 교사와 함께하는 수업 설계 세미나.",cta:"일정 보기",art:"🎤"},
 "예비 중등 추천":{cls:"bn-pre",lab:"초6 학부모",title:"예비 중등 추천",
   copy:"중학교 가기 전, 딱 이만큼.<br>겨울방학 8주 완성 추천 코스.",cta:"추천 코스 보기",art:"⭐"}
};
const BEST=[S("#E63329","📕","빠바 유형편"),S("#4CAF50","🦝","Bricks Reading 30"),S("#5B3FA8","🔤","능률VOCA 수능"),
            S("#2E9BD6","📘","그래머 존 기본"),S("#F5A623","📙","수능만만 독해")];

const $=s=>document.querySelector(s);
const PC=()=>window.matchMedia('(min-width:1024px)').matches;
const shade=h=>{const n=parseInt(h.slice(1),16);
  return `rgb(${Math.max(0,(n>>16)-48)},${Math.max(0,((n>>8)&255)-48)},${Math.max(0,(n&255)-48)})`;};
const cardHTML=(kicker)=>([c,f,t])=>{
  const k=(kicker||'').toUpperCase();
  return `<div class="card"><div class="thumb" style="background:linear-gradient(160deg,${c},${shade(c)})">
    <div class="kicker">${k?k.split(' ')[0]:''}<br>${k?(k.split(' ')[1]||''):''}</div>
    <div class="face">${f}</div>
    <div class="cart"><svg viewBox="0 0 24 24"><path d="M5 6h15l-1.5 9h-12z"/><circle cx="9" cy="20" r="1.2"/><circle cx="17" cy="20" r="1.2"/></svg></div>
  </div><div class="cap">${t}</div></div>`;
};

const rail=$('.panel .rail'),bar=$('.prog i'),tabs=$('.tabs'),panel=$('.panel'),
      paneS=$('.pane.series'),paneP=$('.pane.promo'),promo=$('.g-promo'),dots=$('.pdots');
let cur="ELT";                       /* 마지막으로 고른 과목 (항상 기억) */
let activePromo=null;                /* PC에서 우측 패널을 점유 중인 프로모션 */
const mqPC=window.matchMedia('(min-width:1024px)');
const setActiveBtn=k=>document.querySelectorAll('.cat-body button')
  .forEach(x=>x.classList.toggle('on',x.dataset.k===k));

function updateBar(){
  const max=rail.scrollWidth-rail.clientWidth, ratio=rail.clientWidth/rail.scrollWidth;
  bar.style.width=Math.min(100,ratio*100)+'%';
  bar.style.transform=`translateX(${max?(rail.scrollLeft/max)*(100/ratio-100):0}%)`;
}
function paint(name){
  rail.innerHTML=CAT[cur].series[name].map(cardHTML(name)).join('')
    +`<div class="more"><div class="box"><span class="circle">›</span>전체 보기</div></div>`;
  rail.scrollLeft=0; updateBar();
}
function loadSubject(k){
  cur=k; const d=CAT[k];
  paneP.classList.remove('on'); paneS.classList.add('on');
  $('.eyebrow').innerHTML=d.eb; $('.headline').innerHTML=d.hl; $('.desc').innerHTML=d.ds;
  $('.allview').innerHTML=k+' 전체 보기 <i>›</i>';
  const names=Object.keys(d.series);
  tabs.innerHTML=names.map((n,i)=>`<button class="tab${i?'':' on'}">${n}</button>`).join('');
  tabs.scrollLeft=0; paint(names[0]);
}
function loadPromo(k){
  const d=PROMO[k];
  paneS.classList.remove('on'); paneP.classList.add('on');
  paneP.innerHTML=`<div class="bigbanner ${d.cls}"><span class="lab">${d.lab}</span>
    <h3>${d.title}</h3><p>${d.copy}</p><span class="go">${d.cta} ›</span><span class="art">${d.art}</span></div>`;
}
rail.addEventListener('scroll',updateBar,{passive:true});
tabs.addEventListener('click',e=>{const t=e.target.closest('.tab'); if(!t)return;
  tabs.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  t.classList.add('on'); paint(t.textContent.trim());});
$('.g-subj').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b)return;
  activePromo=null; setActiveBtn(b.dataset.k); loadSubject(b.dataset.k);
  if(!PC()&&panel.getBoundingClientRect().top<0) panel.scrollIntoView({block:'start'});});
promo.addEventListener('click',e=>{const b=e.target.closest('button'); if(!b)return;
  if(!PC()) return;                       /* 모바일 : 배너 클릭 → 해당 페이지 이동 */
  activePromo=b.dataset.k; setActiveBtn(b.dataset.k); loadPromo(b.dataset.k);});

/* 프로모션 롤링 (모바일/태블릿) */
const slides=[...promo.children];
dots.innerHTML=slides.map((_,i)=>`<i${i?'':' class="on"'}></i>`).join('');
const step=()=>slides.length>1?slides[1].offsetLeft-slides[0].offsetLeft:slides[0].offsetWidth;
let idx=0, auto=true;
function syncDots(){const i=Math.round(promo.scrollLeft/step());
  dots.querySelectorAll('i').forEach((d,n)=>d.classList.toggle('on',n===i)); idx=i;}
function go(i,smooth){idx=(i+slides.length)%slides.length;
  promo.scrollTo({left:idx*step(),behavior:smooth?'smooth':'auto'}); syncDots();}
promo.addEventListener('scroll',syncDots,{passive:true});
['pointerdown','touchstart','wheel'].forEach(ev=>promo.addEventListener(ev,()=>{auto=false;},{passive:true}));
dots.addEventListener('click',e=>{const i=[...dots.children].indexOf(e.target); if(i>=0){auto=false;go(i,true);}});
setInterval(()=>{ if(auto&&!PC()&&promo.scrollWidth>promo.clientWidth+4) go(idx+1,true); },4000);

/* ------------------------------------------------------------
   브레이크포인트 전환 시 상태 정리
   PC에서 프로모션을 골라 우측 패널이 배너인 상태로 모바일이 되면,
   ① 패널을 마지막 과목 화면으로 되돌리고
   ② 보고 있던 프로모션을 롤링 배너의 현재 장으로 맞춰준다.
   (반대 방향은 과목 패널이 유지되므로 손댈 것이 없음)
------------------------------------------------------------ */
function onBreakpointChange(){
  if(mqPC.matches){                     /* → PC */
    if(!activePromo) setActiveBtn(cur); /* 목록에서 과목 활성 상태 보장 */
    return;
  }
  if(!activePromo) return;              /* → 모바일 : 정리할 상태 없음 */
  const back=activePromo;
  activePromo=null;
  paneP.classList.remove('on');         /* 배너 패널 닫고 */
  paneS.classList.add('on');            /* 과목 패널 복구 (시리즈 탭 선택도 그대로) */
  setActiveBtn(cur);
  const i=[...promo.children].findIndex(li=>li.querySelector('button').dataset.k===back);
  auto=false;                           /* 사용자가 고른 배너를 자동으로 넘기지 않음 */
  requestAnimationFrame(()=>go(i<0?0:i,false));
}
mqPC.addEventListener('change',onBreakpointChange);

/* 베스트 섹션 */
$('#bestRail').innerHTML=BEST.map(cardHTML('')).join('');

/* 뷰포트 표시 */
const vp=$('#vp'), vpt=vp.querySelector('.t');
function vpUpdate(){
  const w=window.innerWidth;
  const mode = w>=1024 ? 'PC' : (w>=640 ? 'TABLET' : 'MOBILE');
  vpt.innerHTML=`<b>${w}</b>px · ${mode}`;
}
vp.querySelector('.x').addEventListener('click',()=>vp.remove());
window.addEventListener('resize',()=>{vpUpdate();updateBar();syncDots();});
vpUpdate();

loadSubject("ELT");
new ResizeObserver(updateBar).observe(rail);
</script>
</body>
</html>
