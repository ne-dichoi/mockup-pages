<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>NE_Books · 마이페이지 · 후기 작성</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="css/layout.css?v=20260811j">
<script src="js/layout.js?v=20260811j" defer></script>
<script src="js/search.js?v=9" defer></script>
</head>
<body class="page-my page-rvwrite">

  <!-- ===== HEADER ===== -->
  <div id="site-header"></div>

  <!-- ===== PAGE HEAD (하드코딩: layout.js 캐시와 무관하게 항상 표시) ===== -->
  <div id="site-location"><section class="pagehead"><div class="container cart-head-row"><div class="ph-left"><h1 class="ph-title">후기</h1></div><div class="crumb"><a class="home ico" href="index.html"><img src="assets/ic_home.svg" alt="홈"></a><span class="sep">·</span><a href="마이페이지.html#review">마이페이지</a><span class="sep">·</span><span class="cur">후기</span></div></div></section></div>

  <!-- ===== 후기 작성 ===== -->
  <section class="mywrap">
    <div class="container">

      <!-- 마이페이지 대탭 (후기 활성) -->
      <div class="my-tabs">
        <a href="마이페이지.html#home">홈</a>
        <a href="마이페이지.html#orders">주문내역</a>
        <a href="마이페이지.html#points">포인트</a>
        <a href="마이페이지.html#wish">찜</a>
        <a href="마이페이지.html#qna">문의/답변</a>
        <a class="on" href="마이페이지.html#review">후기</a>
        <a href="마이페이지.html#event">이벤트/세미나</a>
      </div>

      <!-- 안내 박스 -->
      <div class="rv-guide">
        <ul class="rv-guide-list">
          <li>상품과 무관한 내용이나 동일 문자의 반복 등 부적합한 내용의 경우에는 무통보 삭제 될 수 있습니다.</li>
        </ul>
      </div>

      <!-- 작성 폼 -->
      <div class="iq-form">
        <!-- 상품명 (교재 검색 자동완성 – 1:1문의 교재오류와 동일) -->
        <div class="iq-row">
          <div class="iq-label">상품명 <span class="iq-req">*</span></div>
          <div class="iq-field">
            <div class="iq-bookname">
              <div class="oh-sel bookcat">
                <button type="button" class="oh-sel-cur"><span class="oh-sel-lb">전체</span><span class="ic"><svg viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="#1d1717" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>
                <div class="oh-sel-menu" hidden><a class="on">전체</a><a>ELT</a><a>초중고(영어)</a><a>교과서 관련</a><a>수험/일반</a><a>수학/국어</a></div>
              </div>
              <div class="bk-search">
                <input class="iq-in search-input iq-clear" type="text" placeholder="제목·내용 검색" autocomplete="off">
                <div class="search-pop" hidden></div>
              </div>
              <button type="button" class="ef-search">검색</button>
            </div>
            <div class="iq-bk-selected" hidden>
              <span class="iq-bk-cover"><img src="assets/best_1.png" alt=""></span>
              <span class="iq-bk-title"></span>
              <button type="button" class="iq-bk-del">삭제</button>
            </div>
          </div>
        </div>

        <!-- 별점 -->
        <div class="iq-row">
          <div class="iq-label">별점 <span class="iq-req">*</span></div>
          <div class="iq-field">
            <div class="rw-rate">
              <div class="rw-stars" id="rwStars">
                <button type="button" class="rw-star" data-v="1" aria-label="1점">★</button>
                <button type="button" class="rw-star" data-v="2" aria-label="2점">★</button>
                <button type="button" class="rw-star" data-v="3" aria-label="3점">★</button>
                <button type="button" class="rw-star" data-v="4" aria-label="4점">★</button>
                <button type="button" class="rw-star" data-v="5" aria-label="5점">★</button>
              </div>
              <span class="rw-score"><b id="rwScore">0.0</b> / 5.0</span>
            </div>
            <span class="rw-hint">* 해당 교재의 평점을 선택해주세요.</span>
          </div>
        </div>

        <!-- 제목 -->
        <div class="iq-row">
          <div class="iq-label">제목 <span class="iq-req">*</span></div>
          <div class="iq-field">
            <input class="iq-in full iq-clear" type="text" placeholder="제목을 입력해 주세요.">
          </div>
        </div>

        <!-- 내용 -->
        <div class="iq-row">
          <div class="iq-label">내용 <span class="iq-req">*</span></div>
          <div class="iq-field">
            <textarea class="iq-textarea" style="height:250px" placeholder="내용을 입력해 주세요."></textarea>
          </div>
        </div>

        <!-- 상품 이미지 -->
        <div class="iq-row">
          <div class="iq-label">상품 이미지</div>
          <div class="iq-field">
            <div class="iq-file">
              <button type="button" class="iq-file-btn" id="rwFileBtn">파일첨부</button>
              <span class="iq-file-name" id="rwFileName"></span>
              <span class="iq-help">(첨부파일의 용량은 5MB까지 가능합니다.)</span>
              <input type="file" id="rwFile" hidden accept="image/*">
            </div>
          </div>
        </div>
      </div>

      <!-- 필수 안내 + 등록 -->
      <div class="iq-actions">
        <span class="iq-req-note"><b>*</b> 표시는 필수 입력 사항 입니다.</span>
        <div class="iq-actions-btns">
          <button type="button" class="iq-btn-submit">등록</button>
        </div>
      </div>

    </div>
  </section>

  <!-- ===== 상품 카테고리 검색 바텀시트 (모바일) ===== -->
  <div class="os-sheet cs-sheet" id="bookCatSheet" hidden>
    <div class="os-dim"></div>
    <div class="os-box" role="dialog" aria-modal="true" aria-label="상품 검색">
      <span class="os-grab"></span>
      <div class="cs-head"><h3>검색</h3></div>
      <div class="cs-cats">
        <button type="button" class="cs-cat on">전체</button>
        <button type="button" class="cs-cat">ELT</button>
        <button type="button" class="cs-cat">초중고(영어)</button>
        <button type="button" class="cs-cat">교과서 관련</button>
        <button type="button" class="cs-cat">수험/일반</button>
        <button type="button" class="cs-cat">수학/국어</button>
      </div>
      <div class="cs-search">
        <input type="text" class="cs-search-in" placeholder="검색어를 입력해 주세요." autocomplete="off">
        <button type="button" class="cs-search-btn" aria-label="검색"><img src="assets/ds_ic_search.svg" alt=""></button>
      </div>
      <div class="cs-results">
        <button type="button" class="cs-result">세 마리 토끼 잡는 초등 독서논술 A단계 세트</button>
        <button type="button" class="cs-result">세 마리 토끼 잡는 초등 독서논술 A1</button>
        <button type="button" class="cs-result">세 마리 토끼 잡는 초등 독서논술 A2</button>
        <button type="button" class="cs-result">세 마리 토끼 잡는 초등 독서논술 A3</button>
        <button type="button" class="cs-result">세 마리 토끼 잡는 초등 독서논술 A4</button>
        <button type="button" class="cs-result">세 마리 토끼 잡는 초등 독서논술 A5</button>
        <button type="button" class="cs-result">세 마리 토끼 잡는 초등 독서논술 B단계 세트</button>
        <button type="button" class="cs-result">세 마리 토끼 잡는 초등 독서논술 B1</button>
        <button type="button" class="cs-result">세 마리 토끼 잡는 초등 독서논술 B2</button>
      </div>
    </div>
  </div>

  <!-- ===== FOOTER ===== -->
  <div id="site-footer"></div>

  <script>
  (function(){
    /* 교재 분류 셀렉트(.oh-sel) 토글 – 1:1문의와 동일 */
    var sels=[].slice.call(document.querySelectorAll('.oh-sel'));
    function closeAll(){ sels.forEach(function(s){ s.classList.remove('open'); var m=s.querySelector('.oh-sel-menu'); if(m) m.hidden=true; }); }
    sels.forEach(function(s){
      var cur=s.querySelector('.oh-sel-cur'), menu=s.querySelector('.oh-sel-menu'), lb=s.querySelector('.oh-sel-lb');
      if(!cur||!menu) return;
      cur.addEventListener('click',function(e){ e.stopPropagation(); var was=s.classList.contains('open'); closeAll(); if(!was){ s.classList.add('open'); menu.hidden=false; } });
      menu.querySelectorAll('a').forEach(function(a){
        a.addEventListener('click',function(e){ e.preventDefault();
          menu.querySelectorAll('a').forEach(function(x){ x.classList.remove('on'); });
          a.classList.add('on'); if(lb) lb.textContent=a.textContent.trim();
          s.classList.remove('open'); menu.hidden=true;
        });
      });
    });
    document.addEventListener('click',function(e){ if(!e.target.closest('.oh-sel')) closeAll(); });

    /* 별점 선택 */
    var stars=[].slice.call(document.querySelectorAll('#rwStars .rw-star'));
    var scoreEl=document.getElementById('rwScore');
    var cur=0;
    function paint(n){ stars.forEach(function(st,i){ st.classList.toggle('on', i<n); }); }
    stars.forEach(function(st){
      var v=+st.getAttribute('data-v');
      st.addEventListener('mouseenter',function(){ paint(v); });
      st.addEventListener('click',function(){ cur=v; paint(v); if(scoreEl) scoreEl.textContent=v.toFixed(1); });
    });
    var wrap=document.getElementById('rwStars');
    if(wrap) wrap.addEventListener('mouseleave',function(){ paint(cur); });

    /* 파일첨부 → 파일명 표시 */
    var fileBtn=document.getElementById('rwFileBtn'), fileInp=document.getElementById('rwFile'), fileName=document.getElementById('rwFileName');
    if(fileBtn&&fileInp){
      fileBtn.addEventListener('click',function(){ fileInp.click(); });
      fileInp.addEventListener('change',function(){ if(fileName) fileName.textContent=fileInp.files&&fileInp.files[0]?fileInp.files[0].name:''; });
    }

    /* 등록 → 진입 경로에 따라 이동 (와이어프레임)
       교재상세에서 왔으면(?from=book) 교재상세 후기 리스트로, 아니면 마이페이지 후기 목록으로 */
    var fromBook=/[?&]from=book\b/.test(location.search);
    var submit=document.querySelector('.iq-btn-submit');
    if(submit) submit.addEventListener('click',function(){ alert('후기가 등록되었습니다.'); location.href= fromBook ? '교재상세.html#s-review' : '마이페이지.html#review'; });
  })();

  /* 모바일: 상품명 카테고리/검색 → 바텀시트(레이어 팝업) */
  (function(){
    function MB(){ return window.matchMedia('(max-width:1023px)').matches; }
    var sheet=document.getElementById('bookCatSheet'); if(!sheet) return;
    var catLb=document.querySelector('.iq-bookname .oh-sel.bookcat .oh-sel-lb');
    var searchIn=document.querySelector('.iq-bookname .bk-search .iq-in');
    var sheetSearch=sheet.querySelector('.cs-search-in');
    var resultEls=[].slice.call(sheet.querySelectorAll('.cs-result'));
    /* 검색어 입력 시에만 결과 노출(한 글자부터 부분일치). 빈값이면 전부 숨김 */
    function filterResults(){
      var q=(sheetSearch.value||'').trim();
      resultEls.forEach(function(el){ el.style.display=(q && el.textContent.indexOf(q)>-1)?'':'none'; });
    }
    if(sheetSearch) sheetSearch.addEventListener('input',filterResults);
    function open(){ if(sheetSearch){ sheetSearch.value=''; filterResults(); } sheet.hidden=false; document.body.style.overflow='hidden'; requestAnimationFrame(function(){ sheet.classList.add('open'); }); }
    function close(){ sheet.classList.remove('open'); setTimeout(function(){ sheet.hidden=true; document.body.style.overflow=''; },250); }

    /* 카테고리 셀렉트 클릭 → 인라인 드롭다운 대신 시트 (캡처단계로 인라인 핸들러 차단) */
    document.addEventListener('click',function(e){
      if(!MB()) return;
      if(e.target.closest('.iq-bookname .oh-sel-cur')){ e.preventDefault(); e.stopPropagation(); open(); }
    },true);
    /* 검색 인풋 포커스 → 키보드 대신 시트 */
    if(searchIn) searchIn.addEventListener('focus',function(){ if(MB()){ searchIn.blur(); open(); } });

    /* dim / grab / ESC 닫기 */
    var dim=sheet.querySelector('.os-dim'), grab=sheet.querySelector('.os-grab');
    if(dim) dim.addEventListener('click',close);
    if(grab) grab.addEventListener('click',close);
    document.addEventListener('keydown',function(e){ if(e.key==='Escape' && !sheet.hidden) close(); });

    /* 카테고리 pill 토글 → 셀렉트 라벨 반영 */
    sheet.querySelectorAll('.cs-cat').forEach(function(b){
      b.addEventListener('click',function(){
        sheet.querySelectorAll('.cs-cat').forEach(function(x){ x.classList.remove('on'); });
        b.classList.add('on'); if(catLb) catLb.textContent=b.textContent.trim();
      });
    });
    /* 검색 결과 클릭 → 상품명 반영 + 닫기 */
    sheet.querySelectorAll('.cs-result').forEach(function(r){
      r.addEventListener('click',function(){ if(searchIn){ searchIn.value=r.textContent.trim(); searchIn.dispatchEvent(new Event('input',{bubbles:true})); } close(); });
    });
  })();
  </script>

</body>
</html>
