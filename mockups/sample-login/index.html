<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 화면 (샘플)</title>
<style>
  body { font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; background: #f7f7f8; display: grid; place-items: center; min-height: 100vh; margin: 0; }
  form { background: #fff; padding: 32px; border-radius: 10px; border: 1px solid #e4e4e7; width: 300px; }
  h1 { font-size: 18px; margin: 0 0 20px; }
  label { display: block; font-size: 13px; margin-bottom: 4px; color: #52525b; }
  input { width: 100%; box-sizing: border-box; padding: 9px 10px; margin-bottom: 14px; border: 1px solid #d4d4d8; border-radius: 6px; font-size: 14px; }
  button { width: 100%; padding: 10px; background: #18181b; color: #fff; border: 0; border-radius: 6px; font-size: 14px; cursor: pointer; }
  a { display: block; margin-top: 20px; font-size: 13px; color: #71717a; text-align: center; }
</style>
</head>
<body>
<form onsubmit="return false">
  <h1>로그인</h1>
  <label for="email">이메일</label>
  <input id="email" type="email" placeholder="you@example.com">
  <label for="pw">비밀번호</label>
  <input id="pw" type="password" placeholder="••••••••">
  <button type="submit">로그인</button>
  <a href="../../">← 목록으로</a>
</form>
</body>
</html>
