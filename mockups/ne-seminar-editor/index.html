<title>혼강 세미나 에디터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800;900&family=Inter:wght@400;600;800&family=Noto+Sans+KR:wght@300..900&display=swap">

@font-face{
  font-family:'Paperlogy';font-weight:700;font-display:swap;
  src:local('Paperlogy 7 Bold'),local('Paperlogy-7Bold'),
      url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2') format('woff2');
}
@font-face{
  font-family:'Paperlogy';font-weight:800;font-display:swap;
  src:local('Paperlogy 8 ExtraBold'),local('Paperlogy-8ExtraBold'),
      url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-8ExtraBold.woff2') format('woff2');
}

  font-family:'Paperlogy';font-weight:600;font-display:swap;
  src:local('Paperlogy 6 SemiBold'),local('Paperlogy-6SemiBold'),
      url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-6SemiBold.woff2') format('woff2');
}

/* ─── NE_Books 디자인 시스템 ──────────────────────────────────────
   출처: mockup-pages/mockups/ne-books-mall/{DESIGN_TOKENS.md, css/tokens.css}
   편집 UI(상단 바 + 오른쪽 패널)에만 적용한다.
   왼쪽 미리보기(포스터·배너)는 Figma 혼강세미나 값을 그대로 쓴다. */
:root{
  /* Color — 라인은 #E5E5E5 하나, 배경은 #FFFFFF / #F3F3F3 두 가지만 */
  --ink:#1D1717;
  --ink-2:#666666;
  --ink-3:#A9A9A9;
  --surface:#FFFFFF;
  --surface-2:#F3F3F3;
  --canvas:#F3F3F3;
  --line:#E5E5E5;
  --line-2:#E5E5E5;
  --accent:#E83828;
  --accent-ink:#FFFFFF;
  --accent-soft:#F3F3F3;
  --btn-dark:#4D4E4D;
  --danger:#E83828;
  --danger-soft:#F3F3F3;
  --ok:#2F74D1;

  /* Typography — 12·13·14·16·24 만 사용 */
  --f-ui:'Pretendard','Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;
  --f-body:'Pretendard','Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;
  --f-display:'Paperlogy','Gothic A1','Pretendard','Noto Sans KR',sans-serif;
  --f-num:'Inter','Pretendard','Noto Sans KR',sans-serif;
  --rail:510px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--ink-2);font-family:var(--f-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ─── app shell ──────────────────────────────────────────────────── */
.app{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--line);flex:0 0 auto}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto;min-width:0}
.brand span{padding-bottom:2px}
.brand b{font-family:var(--f-display);font-size:24px;font-weight:700;color:var(--ink);white-space:nowrap;letter-spacing:-.02em}
.brand span{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saved{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap;margin-right:8px}
.saved,.saved.on{color:var(--ok)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;box-sizing:border-box;
  font-family:var(--f-ui);font-size:14px;font-weight:500;line-height:1;
  height:48px;padding:0 24px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#C9C9C9}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:#D22F20}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{height:36px;padding:0 14px;font-size:13px}
/* 흰 면이므로 테두리 유지(북스: 흰 박스 + --line). 비활성도 버튼 형태는 남긴다. */
.btn.icon{height:36px;width:36px;padding:0;font-size:13px;background:var(--surface);border-color:var(--line)}
/* 비활성이어도 흰 면과 테두리는 유지하고 아이콘만 연하게 */
.btn.icon:disabled{background:var(--surface);border-color:var(--line);color:var(--ink-3)}
/* 삭제 버튼도 중립 — 빨강은 primary 한 곳에만 */
.btn.del{border-color:var(--line);color:var(--ink)}
.btn.del:hover{border-color:#C9C9C9}
.btn:disabled{background:#D3D3D3;border-color:#D3D3D3;color:#FFFFFF;cursor:default;pointer-events:none}

/* ─── split ──────────────────────────────────────────────────────── */
.split{display:grid;grid-template-columns:minmax(0,1fr) var(--rail);grid-template-rows:minmax(0,1fr);
  flex:1 1 auto;min-height:0}
.stage{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--canvas)}
.stagebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 24px;border-bottom:1px solid var(--line);
  background:var(--surface);flex:0 0 auto}
.jump{display:flex;gap:4px;margin-right:auto;flex-wrap:wrap}
.jump button{padding:8px 12px;border:0;background:transparent;color:var(--ink-2);border-radius:8px;cursor:pointer;font-size:14px}
.jump button:hover{background:var(--surface-2);color:var(--ink)}
.zoomval{font-size:14px;color:var(--ink-2);min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
.scroll{flex:1 1 auto;overflow:auto;padding:24px;display:flex;justify-content:center;align-items:flex-start;background:var(--canvas)}
.holder{transform-origin:top center;flex:0 0 auto}

/* ─── rail ───────────────────────────────────────────────────────── */
.rail{background:var(--surface);border-left:1px solid var(--line);overflow-y:auto;overflow-x:hidden;
  display:flex;flex-direction:column;min-width:0;min-height:0}
.sec{border-bottom:1px solid var(--line)}
.sec>summary{display:flex;align-items:center;gap:8px;padding:16px;cursor:pointer;list-style:none;
  font-size:16px;font-weight:700;color:var(--ink);user-select:none}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::before{content:'';width:5px;height:5px;border-right:1.5px solid var(--ink-3);border-bottom:1.5px solid var(--ink-3);
  transform:rotate(-45deg);transition:transform .15s;flex:0 0 auto;margin-right:2px}
.sec[open]>summary::before{transform:rotate(45deg)}
.sec>summary:hover{background:var(--surface-2)}
.sec .num{margin-left:auto;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.body{padding:24px 16px 32px;display:flex;flex-direction:column;gap:24px}

.f{display:flex;flex-direction:column;gap:8px;min-width:0}
/* .flab 안에 들어간 라벨(선택 강조 버튼이 붙는 필드)도 잡히도록 자손 선택자로 */
.f label{font-size:12px;font-weight:400;color:var(--ink-2)}
.flab{display:flex;align-items:center;justify-content:space-between;gap:8px}
.flab .btn{padding:6px 10px;font-size:12px;border-radius:8px}
.f .hint{font-size:12px;color:var(--ink-3);line-height:1.5}
input[type=text],input[type=date],input[type=number],input[type=month],select,textarea{
  width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid var(--line);border-radius:8px;
  background:var(--surface);color:var(--ink);font-family:var(--f-ui);font-size:14px;min-width:0;
  outline:none;transition:border-color .15s}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
input[type=date],input[type=month]{font-family:var(--f-ui);line-height:1.4;-webkit-appearance:none;appearance:none}
input[type=date]::-webkit-calendar-picker-indicator,
input[type=month]::-webkit-calendar-picker-indicator{opacity:.45;cursor:pointer}
input[type=date][disabled]::-webkit-calendar-picker-indicator,
input[type=month][disabled]::-webkit-calendar-picker-indicator{opacity:.2;cursor:not-allowed}
input:hover,textarea:hover,select:hover{border-color:#C9C9C9}
input:focus,textarea:focus,select:focus{border-color:var(--ink)}
input[disabled],select[disabled],textarea[disabled]{
  background:var(--surface-2);color:var(--ink-3);border-color:var(--surface-2);cursor:not-allowed}
textarea{resize:vertical;line-height:1.55;min-height:84px}
.row{display:flex;gap:8px;align-items:flex-end}
.row>.f{flex:1 1 0}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);cursor:pointer;padding:2px 0}
/* 북스 DS: --check #D94A34 = 체크박스 배경, 체크는 흰색 */
.chk input{-webkit-appearance:none;appearance:none;position:relative;flex:0 0 auto;
  width:20px;height:20px;margin:0;border:1px solid #C4C4C4;border-radius:6px;
  background:var(--surface);cursor:pointer;transition:background .12s,border-color .12s}
.chk input:hover{border-color:#A9A9A9}
.chk input:checked{
  border-color:#D94A34;
  background:#D94A34 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><path d='M5.2 10.4l3.2 3.2 6.4-6.8' fill='none' stroke='%23FFFFFF' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/></svg>") center/15px 15px no-repeat;}
.chk input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.swatch{display:flex;align-items:center;gap:8px}
/* 색이 칩 전체를 채우도록 — 바깥 테두리·여백 없이 */
.swatch input[type=color]{width:44px;height:44px;padding:0;border:0;border-radius:10px;
  background:none;cursor:pointer;flex:0 0 auto;overflow:hidden;-webkit-appearance:none;appearance:none}
.swatch input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.swatch input[type=color]::-webkit-color-swatch{border:1px solid rgba(0,0,0,.07);border-radius:10px}
.swatch input[type=color]::-moz-color-swatch{border:1px solid rgba(0,0,0,.07);border-radius:10px}
.swatch input[type=text]{font-family:var(--f-num);text-transform:uppercase;letter-spacing:.02em}
.presets{display:flex;gap:8px;flex-wrap:wrap}
.pre{width:34px;height:34px;border-radius:10px;border:1px solid rgba(0,0,0,.10);cursor:pointer;padding:0}
.pre[aria-pressed=true]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}

/* 북스 DS: 회색 배경 요소는 테두리를 쓰지 않는다 */
.card{border:0;border-radius:10px;overflow:hidden;background:var(--surface-2)}
.card>summary{display:flex;align-items:center;gap:8px;padding:16px 24px;cursor:pointer;list-style:none;font-size:14px;font-weight:700;color:var(--ink)}
.card>summary::-webkit-details-marker{display:none}
.card>summary:hover{background:#EBEBEB}
.dot{width:13px;height:13px;border-radius:4px;flex:0 0 auto;border:1px solid rgba(0,0,0,.15)}
.card .when{color:var(--ink-3);font-weight:400;font-size:13px;font-variant-numeric:tabular-nums;flex:0 0 auto}
.card .tools{display:flex;gap:4px}   /* 아이콘 묶음은 반 스텝(4px) */
.card .inner{padding:24px;display:flex;flex-direction:column;gap:24px;background:var(--surface-2)}
.sub{font-size:14px;font-weight:700;color:var(--ink);margin-top:8px;padding-top:24px;border-top:1px solid var(--line)}

.drop{border:1px dashed #C4C4C4;border-radius:8px;padding:20px 16px;text-align:center;cursor:pointer;background:var(--surface)}
.drop:hover,.drop.over{border-color:var(--ink);background:#EBEBEB}
.drop input{display:none}
.drop .big{font-size:14px;font-weight:500;color:var(--ink)}
.drop .small{font-size:12px;color:var(--ink-3);margin-top:6px}
.thumb{display:flex;gap:16px;align-items:flex-start}
.thumb .pic{width:74px;height:96px;border-radius:8px;flex:0 0 auto;border:1px solid var(--line-2);
  background-color:#6A3CE0;
  background-image:linear-gradient(45deg,rgba(255,255,255,.14) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.14) 75%),
                   linear-gradient(45deg,rgba(255,255,255,.14) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.14) 75%);
  background-size:12px 12px;background-position:0 0,6px 6px}
.thumb .pic img{width:100%;height:100%;object-fit:contain;display:block}
.thumb .meta{flex:1 1 0;display:flex;flex-direction:column;gap:8px;min-width:0}
.range{display:grid;grid-template-columns:72px 1fr 44px;gap:8px;align-items:center}
.range label{font-size:12px;color:var(--ink-2)}
.range input[type=range]{width:100%;accent-color:var(--accent)}
.range output{font-size:12px;color:var(--ink-3);text-align:right;font-variant-numeric:tabular-nums}
.busy{font-size:12px;color:var(--accent);display:flex;align-items:center;gap:8px}
.warn{font-size:12px;color:var(--danger);line-height:1.5;background:#FDEDEB;
  border-radius:8px;padding:12px 14px}
#calWarn:empty{display:none}

.addbar{display:flex;gap:8px;align-items:center}
.addbar .btn{flex:1 1 0;min-width:0;justify-content:center}


/* ═══ BANNERS ═══════════════════════════════════════════════════════
   포스터와 같은 테마 값을 쓰되, 각 배너는 Figma 실측 좌표로 고정한다. */
.bnstage{display:flex;flex-direction:column;gap:24px;align-items:flex-start}
.bncard{display:flex;flex-direction:column;gap:8px}
.bnhead{display:flex;align-items:baseline;gap:8px;font-size:12px;color:var(--ink-3)}
.bnhead b{font-size:13px;font-weight:600;color:var(--ink)}
.bnhead .px{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.bn{position:relative;overflow:hidden;font-family:var(--f-body);color:#fff;flex:0 0 auto;
  box-shadow:0 1px 10px rgba(28,18,56,.16)}
.bn *{box-sizing:border-box}
.bn p{margin:0}
.bn svg{display:block}
.bn .t{position:absolute}
.bn .kick{position:absolute;font-family:var(--f-display);font-weight:700;white-space:nowrap;line-height:1}
.bn .mo{position:absolute;font-family:var(--f-display);font-weight:900;color:#fff;line-height:1;white-space:nowrap}
.bn .deco{position:absolute;display:flex;align-items:flex-start}
.bn .deco i{display:block;flex:0 0 auto}
.bn .t svg{width:100%;height:auto}
/* 투명 배경 배너는 편집 화면에서만 체크무늬로 표시한다 */
.bn.alpha{background-color:#fff;
  background-image:linear-gradient(45deg,#E4E0EC 25%,transparent 25%,transparent 75%,#E4E0EC 75%),
                   linear-gradient(45deg,#E4E0EC 25%,transparent 25%,transparent 75%,#E4E0EC 75%);
  background-size:20px 20px;background-position:0 0,10px 10px}

/* ─── modal ──────────────────────────────────────────────────────── */
/* 월 선택기 — 네이티브 팝업은 브라우저가 그려서 스타일이 안 먹으므로 직접 만든다 */
.ymwrap{position:relative}
.ymbtn{width:100%;height:48px;padding:0 14px;text-align:left;border:1px solid var(--line);
  border-radius:8px;background:var(--surface);color:var(--ink);font-family:var(--f-ui);font-size:14px;cursor:pointer}
.ymbtn:hover:not(:disabled){border-color:#C9C9C9}
.ymbtn:disabled{background:var(--surface-2);color:var(--ink-3);border-color:var(--surface-2);cursor:not-allowed}
.ympanel[hidden]{display:none}
.ympanel{position:absolute;z-index:30;top:calc(100% + 8px);left:0;width:320px;max-width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:16px;
  box-shadow:0 8px 24px rgba(29,23,23,.12);padding:24px}
.ympanel .yhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.ympanel .yhead b{font-size:16px;font-weight:700;color:var(--ink)}
.ympanel .ynav{display:flex;gap:8px}
.ympanel .ynav button{width:32px;height:32px;border:0;background:none;color:var(--ink-3);
  font-family:var(--f-ui);font-size:16px;border-radius:8px;cursor:pointer;line-height:1}
.ympanel .ynav button:hover{background:var(--surface-2);color:var(--ink)}
.ympanel .ygrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ympanel .ygrid button{height:48px;border:0;background:none;border-radius:8px;
  font-family:var(--f-ui);font-size:14px;color:var(--ink);cursor:pointer}
.ympanel .ygrid button:hover{background:var(--surface-2)}
.ympanel .ygrid button[aria-selected=true]{background:var(--accent);color:#fff;font-weight:700}
.ympanel .yfoot{display:flex;justify-content:space-between;align-items:center;
  margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.ympanel .yfoot button{border:0;background:none;color:var(--ink-2);font-family:var(--f-ui);
  font-size:14px;cursor:pointer;padding:8px 0}
.ympanel .yfoot button:hover{color:var(--ink)}

/* 날짜 선택기 — 월 선택기와 같은 규격 */
.dpwrap{position:relative}
.dppanel{width:336px;max-width:none}   /* 좁은 컬럼 안이라 100% 제한을 푼다 */
.dppanel .dwk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:8px}
.dppanel .dwk span{height:32px;display:flex;align-items:center;justify-content:center;
  font-size:12px;color:var(--ink-3)}
.dppanel .dgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dppanel .dgrid button{height:40px;border:0;background:none;border-radius:999px;
  font-family:var(--f-num);font-size:14px;color:var(--ink);cursor:pointer}
.dppanel .dgrid button:hover{background:var(--surface-2)}
.dppanel .dgrid button.off{color:var(--ink-3)}
.dppanel .dgrid button[aria-selected=true]{background:var(--accent);color:#fff;font-weight:700}
/* 카드 헤더는 한 줄 유지 */
.card>summary{flex-wrap:nowrap}
.card[open]>summary{border-bottom:1px solid var(--line)}
.card>summary>span:nth-child(2){flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.modal[hidden]{display:none!important}
.modal{position:fixed;inset:0;background:rgba(13,13,13,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.sheet{background:var(--surface);border-radius:16px;max-width:960px;width:100%;max-height:80vh;display:flex;flex-direction:column;overflow:hidden}
.sheet header{flex:none;display:flex;align-items:center;gap:16px;padding:40px 40px 0}
.sheet header h2{margin:0;font-family:var(--f-display);font-size:24px;font-weight:700;color:var(--ink)}
/* 닫기 = X 아이콘 24×24, 선 #1D1717 (북스 §10) */
.sheet-x{margin-left:auto;width:24px;height:24px;padding:0;border:0;background:none;
  cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.sheet-x svg{display:block}
.sheet .content{flex:1;min-height:0;padding:24px 40px 40px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.sheet .content p{margin:0;font-size:14px;color:var(--ink-2);line-height:1.6}
.sheet .content p.apart{margin-top:24px}   /* flex gap 16 + 24 = 40 */
.shots{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
.shot{display:flex;flex-direction:column;gap:8px;align-items:center;max-width:300px}
.shot img{max-width:100%;border:1px solid var(--line);border-radius:8px;display:block;background:#fff}
.shot .cap{font-size:12px;color:var(--ink-3)}
.sheet textarea{min-height:200px;font-family:var(--f-num);font-size:12px}

@media (max-width:1280px){:root{--rail:440px}}
@media (max-width:900px){
  .split{grid-template-columns:1fr;grid-template-rows:1fr}
  .rail{border-left:0;border-top:1px solid var(--line)}
  .stage[hidden],.rail[hidden]{display:none}
  .tabs{display:flex!important}
}
.tabs{display:none;gap:4px}
.tabs .btn{border-radius:999px;height:36px;padding:0 18px}
.tabs button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ═══ POSTER ═════════════════════════════════════════════════════════
   815px fixed artwork. Never follows the viewer theme — it is print. */
.pf{width:815px;background:#fff;color:#222;font-family:var(--f-body);line-height:1.5;
  box-shadow:0 2px 28px rgba(28,18,56,.22);position:relative}
.pf *{box-sizing:border-box}
:where(.pf) :where(p,h1,h2,h3,h4,ul){margin:0}
:where(.pf) :where(ul){padding:0;list-style:none}

/* hero */
.pf-hero{height:1020px;padding:60px 40px;position:relative;overflow:hidden;color:#fff}
.pf-hero .top{display:flex;align-items:flex-start;justify-content:space-between}
.pf-hero .top svg{display:block}
.pf-title{position:relative;width:735px;height:231px;margin-top:60px}
.pf-title svg{display:block;width:735px;height:232px}
.pf-kicker{position:absolute;left:311.7px;top:33.3px;font-family:var(--f-display);font-weight:700;
  font-size:36px;letter-spacing:-.48px;white-space:nowrap;line-height:1}
.pf-desc{margin-top:40px;width:735px;text-align:center;font-size:20px;font-weight:500;line-height:32px;white-space:pre-line}
.pf-illust{position:absolute;left:40px;top:530px;width:735px;height:490px}
.pf-illust svg{display:block;width:735px;height:490px}

/* shared section heads */
.pf-sec{padding:120px 40px}
.pf-head{display:flex;flex-direction:column;align-items:center;gap:20px}
.pf-badge{display:inline-flex;align-items:center;padding:8px 20px;border-radius:10px;background:#222;
  color:#fff;font-size:18px;font-weight:600;line-height:1.2}
.pf-h2{font-family:var(--f-display);font-weight:800;font-size:50px;color:#222;text-align:center;line-height:1.2}

/* calendar */
.pf-cal{background:#EFF9FF}
.pf-calcard{margin-top:40px;background:#fff;border-radius:30px;padding:60px 40px;position:relative}
.pf-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.pf-wd{height:102px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:600;color:rgba(0,0,0,.3)}
.pf-wd.on{color:#000}
.pf-day{height:90px;display:flex;align-items:center;justify-content:center;position:relative}
.pf-day .n{width:70px;height:70px;display:flex;align-items:center;justify-content:center;
  font-family:var(--f-num);font-size:32px;color:rgba(0,0,0,.88);font-variant-numeric:tabular-nums}
.pf-day.red .n{color:rgba(255,0,0,.88)}
.pf-day.mark .n{border-radius:10px;color:#fff;font-weight:800}
.pf-pill{position:absolute;bottom:74px;left:50%;transform:translateX(-50%);z-index:2;
  display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 4px 2px rgba(0,0,0,.1))}
.pf-pill .txt{background:#000;color:#fff;border-radius:26px;padding:10px 14px;font-size:18px;font-weight:600;
  line-height:1;white-space:nowrap}
.pf-pill .txt em{font-style:normal;font-weight:400;color:rgba(255,255,255,.8)}
.pf-pill .tip{width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:9px solid #000;margin-top:-1px}
.pf-legend{margin-top:40px;padding:0 20px;display:flex;flex-direction:column;gap:20px}
.pf-legend li{display:flex;gap:24px;align-items:center}
.pf-legend .chip{width:70px;height:70px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  color:#fff;font-family:var(--f-num);font-weight:800;font-size:32px;flex:0 0 auto}
.pf-legend .tx{display:flex;flex-direction:column;gap:10px;min-width:0}
.pf-legend .tx .a{font-size:18px;font-weight:500;color:#666}
.pf-legend .tx .b{font-size:24px;font-weight:700;color:#000;line-height:1.3}

/* detail cards */
.pf-detail{background:#fff}
.pf-cards{margin-top:40px;display:flex;flex-direction:column;gap:80px}
.pf-card{border-radius:40px;padding:60px 40px;position:relative;overflow:hidden;color:#fff;min-height:620px;
  display:flex;align-items:flex-end}
.pf-card .col{width:657px;display:flex;flex-direction:column;gap:80px;position:relative}
.pf-card .col>div:first-child{position:relative;z-index:2}
.pf-notes>div:first-child{position:relative;z-index:2}
.pf-when{display:flex;flex-direction:column;align-items:center;padding-bottom:50px;border-bottom:1px solid rgba(255,255,255,.4)}
.pf-when .r1{display:flex;gap:10px;align-items:flex-start;width:100%}
.pf-when .dt{flex:1 1 0;display:flex;gap:30px;font-size:70px;font-weight:800;line-height:1.1}
.pf-live{margin-top:16px;display:inline-flex;gap:3.3px;align-items:center;padding:4.9px 13px;border-radius:35px;
  background:rgba(255,255,255,.1);border:.815px solid rgba(255,255,255,.3);flex:0 0 auto}
.pf-live svg{display:block;width:88px;height:19.6px}
.pf-live b{font-size:19.6px;font-weight:700;line-height:1}
.pf-when .tm{width:100%;font-size:24px;font-weight:500;margin-top:0}
.pf-copy{display:flex;flex-direction:column;gap:10px;margin-top:50px}
.pf-copy h3{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:54px;letter-spacing:-.22px;white-space:pre-line}
.pf-copy .lead{white-space:pre-line}
.pf-copy p{font-size:18px;line-height:28px;color:rgba(255,255,255,.7);white-space:pre-line}
.pf-notes{width:420px;display:flex;flex-direction:column;gap:40px}
.pf-notes h4{font-size:30px;font-weight:800;margin-bottom:10px}
.pf-notes ul{display:flex;flex-direction:column}
.pf-notes li{font-size:18px;line-height:28px;color:rgba(255,255,255,.8);padding-left:27px;position:relative}
.pf-notes li::before{content:'';position:absolute;left:11px;top:12.5px;width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.8)}
.pf-who{background:#fff;border-radius:20px;padding:30px 40px;position:relative;z-index:0}
.pf-who .nm{font-size:24px;font-weight:700;color:#222;line-height:36px}
.pf-who .bio{font-size:18px;line-height:24px;color:#666;white-space:pre-line}
.pf-photo{position:absolute;bottom:0;right:0;z-index:1;pointer-events:none;display:block;width:auto;max-width:none}

/* benefits */
.pf-ben{background:#F7F7F7}
.pf-benlist{margin-top:80px;display:flex;flex-direction:column;gap:80px}
.pf-b{display:flex;flex-direction:column;gap:20px}
.pf-b .cap{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.pf-b .tag{font-size:22px;font-weight:700;text-decoration:underline;text-underline-position:from-font}
.pf-b .t{font-size:40px;font-weight:900;color:#212121;line-height:50px}
.pf-b .s{font-size:18px;color:#666;line-height:24px}
.pf-brow{background:#fff;border-radius:20px;padding-left:70px;padding-right:40px;display:flex;align-items:center;
  gap:20px;overflow:hidden}
.pf-tkwrap{width:280px;height:240px;position:relative;flex:0 0 auto}
.pf-tkshadow{position:absolute;left:33.5px;top:188.5px;width:210px;height:12px;border-radius:50%;
  background:radial-gradient(50% 50% at 50% 50%,rgba(0,0,0,.16),rgba(0,0,0,0) 70%)}
.pf-tk{position:absolute;left:26.7px;top:56.8px;width:226.6px;height:126.4px;transform:rotate(-8deg)}
.pf-tk svg{position:absolute;inset:0;display:block}
.pf-tk .lg{position:absolute;left:65.1px;top:23.5px;width:95.5px;height:10.5px}
.pf-tk .lg svg{width:95.5px;height:10.5px}
.pf-tk .amt{position:absolute;left:0;right:0;top:38px;text-align:center;font-family:var(--f-display);font-weight:800;
  font-size:37px;line-height:1;color:#fff;white-space:nowrap}
.pf-tk .cp{position:absolute;left:0;right:0;top:84px;text-align:center;font-family:var(--f-display);font-weight:600;
  font-size:11.5px;letter-spacing:.115px;color:rgba(255,255,255,.5)}
.pf-benimg{position:absolute;left:50%;top:50%;translate:-50% -50%;width:auto;max-width:100%;display:block}
.pf-bnote{flex:1 1 0;font-size:24px;font-weight:600;color:#212121;line-height:36px;white-space:pre-line}
.pf-gift{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
.pf-giftart{width:336px;height:200px;position:relative}
.pf-giftart svg{position:absolute;inset:0;display:block}
.pf-giftart .em{position:absolute;left:96.6px;top:39.8px;font-size:160px;line-height:1}
.pf-gift .t{font-size:40px;font-weight:900;color:#212121}
.pf-gift .s{font-size:18px;color:#666;line-height:28px;white-space:pre-line;max-width:658px}

/* registration + footer */
.pf-reg{background:#575757;padding:80px 40px;color:#fff}
.pf-reg .lab{display:inline-block;font-size:16px;font-weight:500;color:rgba(255,255,255,.6);
  border-bottom:1px solid rgba(255,255,255,.5);line-height:1.4}
.pf-reg h2{font-size:40px;font-weight:800;margin-top:10px}
.pf-reg ul{margin-top:20px;display:flex;flex-direction:column}
.pf-reg li{font-size:18px;line-height:28px;color:rgba(255,255,255,.8);padding-left:27px;position:relative}
.pf-reg li::before{content:'';position:absolute;left:11px;top:12.5px;width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.8)}
.pf-foot{background:#fff;border-top:1px solid #E5E5E5;padding:40px 50px;display:flex;align-items:center;justify-content:space-between}
.pf-foot .a{font-size:15px;font-weight:700;color:#121212}
.pf-foot .b{font-size:13.7px;color:#999}
.pf-foot svg{display:block;width:73.6px;height:23.6px}
</style>

<div class="app">
  <header class="topbar">
    <div class="brand"><b>혼강 세미나 에디터</b><span id="brandsub">NE Build &amp; Grow</span></div>
    <div class="tabs">
      <button class="btn sm" id="tabPrev" aria-pressed="true">미리보기</button>
      <button class="btn sm" id="tabEdit" aria-pressed="false">편집</button>
    </div>
    <span class="saved" id="saved"></span>
    <button class="btn" id="btnLoad">불러오기</button>
    <button class="btn" id="btnSave">설정 저장</button>
    <button class="btn" id="btnReset">초기화</button>
    <button class="btn primary" id="btnExport">이미지 만들기</button>
  </header>

  <div class="split">
    <section class="stage" id="stage">
      <div class="stagebar">
        <div class="tabs" style="display:flex;margin-right:10px">
          <button class="btn sm" id="modePoster" aria-pressed="true">상세페이지</button>
          <button class="btn sm" id="modeBanner" aria-pressed="false">배너 7종</button>
        </div>
        <nav class="jump" id="jump">
          <button data-to="hero">표지</button>
          <button data-to="cal">일정</button>
          <button data-to="detail">상세</button>
          <button data-to="ben">혜택</button>
          <button data-to="reg">안내</button>
        </nav>
        <button class="btn sm" id="zOut" aria-label="축소">−</button>
        <span class="zoomval" id="zVal">40%</span>
        <button class="btn sm" id="zIn" aria-label="확대">＋</button>
        <button class="btn sm" id="zFit">맞춤</button>
      </div>
      <div class="scroll" id="stageScroll">
        <div class="holder" id="holder"><article class="pf" id="poster"></article></div>
        <div class="holder" id="bnHolder" hidden><div class="bnstage" id="banners"></div></div>
      </div>
    </section>
    <aside class="rail" id="rail"></aside>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <header><h2 id="mTitle"></h2>
      <button class="sheet-x" id="mClose" aria-label="닫기">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 5L19 19M19 5L5 19" stroke="#1D1717" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button></header>
    <div class="content" id="mBody"></div>
  </div>
</div>

<input type="file" id="jsonPick" accept="application/json,.json" hidden>

/* ── colour helpers ───────────────────────────────────────────────── */
const hex2rgb = h => {
  h = h.replace('#','');
  if (h.length === 3) h = h.split('').map(c=>c+c).join('');
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
};
const rgb2hex = (r,g,b) => '#' + [r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('').toUpperCase();
function rgb2hsl(r,g,b){
  r/=255; g/=255; b/=255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), l=(mx+mn)/2;
  let h=0, s=0;
  if(mx!==mn){
    const d=mx-mn;
    s = l>.5 ? d/(2-mx-mn) : d/(mx+mn);
    h = mx===r ? ((g-b)/d + (g<b?6:0)) : mx===g ? ((b-r)/d+2) : ((r-g)/d+4);
    h*=60;
  }
  return [h, s, l];
}
function hsl2rgb(h,s,l){
  h=((h%360)+360)%360; s=Math.max(0,Math.min(1,s)); l=Math.max(0,Math.min(1,l));
  const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2;
  const t = h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];
  return [(t[0]+m)*255,(t[1]+m)*255,(t[2]+m)*255];
}
const toHsl = hex => rgb2hsl(...hex2rgb(hex));
const fromHsl = (h,s,l) => rgb2hex(...hsl2rgb(h,s,l));
/* shift a stock colour onto a new hue, keeping its own sat/lightness relationship */
function shift(hex, dH, dS, dL){
  const [h,s,l] = toHsl(hex);
  return fromHsl(h+dH, s*(1+dS), Math.max(0.03, Math.min(.97, l+dL)));
}

const dparse = s => { const [y,m,d] = (s||'').split('-').map(Number); return (y&&m&&d) ? new Date(y,m-1,d) : null; };

/* 달력이 보여줄 연·월: 기본은 가장 이른 세미나 날짜를 따라간다 */
function calYM(){
  if (S.cal.auto !== false){
    const ds = S.seminars.map(x => dparse(x.date)).filter(Boolean).sort((a,b) => a-b);
    if (ds.length){
      // 가장 많은 세미나가 몰린 달을 고른다 — 한 건의 오타에 달력 전체가 끌려가지 않도록
      const tally = new Map();
      ds.forEach(d => {
        const k = d.getFullYear() + '-' + d.getMonth();
        tally.set(k, (tally.get(k) || 0) + 1);
      });
      let best = null, bestN = 0;
      for (const [k,n] of tally) if (n > bestN){ bestN = n; best = k; }   // ds는 정렬돼 있어 동률이면 이른 달
      const [y,m] = best.split('-').map(Number);
      return { y, m: m+1 };
    }
  }
  const [y,m] = String(S.cal.ym || '2026-10').split('-').map(Number);
  return { y: y || 2026, m: m || 10 };
}

let S = defaults();

/* ── derived palette ──────────────────────────────────────────────── */
function palette(){
  const t = S.theme;
  if (!t.autoIllust) return { il: STOCK.il.slice() };
  const a = toHsl(t.main), b = toHsl(STOCK.main);
  const dH = a[0]-b[0], dS = (a[1]-b[1])/Math.max(b[1],.01), dL = a[2]-b[2];
  return { il: STOCK.il.map(c => shift(c, dH, dS, dL*0.6)) };
}
let uidSeq = 0;
function uniq(svg){
  const n = ++uidSeq;
  return svg.replace(/id="([^"]+)"/g, (m,id) => `id="${id}_${n}"`)
            .replace(/url\(#([^)]+)\)/g, (m,id) => `url(#${id}_${n})`);
}
const fill = (svg, map) => uniq(svg.replace(/\{\{(\w+)\}\}/g, (m,k) => map[k] ?? m));
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* *별표*로 감싼 구간만 강조색 — 문장 어디에 와도, 조사가 붙어도 된다 */
const mark = (str, color) => esc(str).split(/(\*[^*\n]+\*)/)
  .map(seg => /^\*[^*\n]+\*$/.test(seg) ? `<span style="color:${color}">${seg.slice(1,-1)}</span>` : seg)
  .join('');
const unmark = str => String(str??'').replace(/\*/g, '');
/* 줄바꿈을 넘어가는 *…* 는 강조로 인식되지 않으므로 줄마다 다시 감싼다 */
const fixMarks = str => String(str ?? '').replace(/\*([^*]+)\*/g,
  (m, inner) => inner.split('\n').map(l => l.trim() ? '*' + l + '*' : l).join('\n'));
const lines = s => String(s??'').split('\n').map(x=>x.trim()).filter(Boolean);

/* 사진마다 원본 크롭(전신/상반신)이 달라 같은 px로는 절대 통일되지 않는다.
   그래서 투명 배경 실루엣에서 머리 높이를 직접 재고, 그걸 기준으로 크기를 맞춘다.
   → 세 장의 얼굴 크기가 같아지고, 잘리는 지점도 저절로 같아진다. */
/* 머리 높이만 기준으로 삼으면 긴 머리(어깨를 덮는 헤어)에서 어깨선이 일찍 잡혀
   같은 높이라도 얼굴이 커 보인다. 그래서 높이·폭 두 기준의 기하평균을 쓴다. */
const HEAD_H = 215;             // 정수리~어깨선 목표 높이
const HEAD_W = 190;             // 머리 최대 폭 목표
const CARD_W = 735;

async function measureFigure(src){
  const im = await loadImage(src);
  const W = 120, H = Math.max(8, Math.round(im.height * W / im.width));
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d', { willReadFrequently:true });
  ctx.drawImage(im, 0, 0, W, H);
  const d = ctx.getImageData(0, 0, W, H).data;
  const rows = [];
  for (let y=0; y<H; y++){
    let n=0, sx=0;
    for (let x=0; x<W; x++) if (d[(y*W+x)*4+3] > 40){ n++; sx += x; }
    rows.push({ n, cx: n ? sx/n : 0 });
  }
  const top = rows.findIndex(r => r.n > 1);
  if (top < 0) return null;
  const opaque = rows.reduce((a,r)=>a+r.n, 0) / (W*H);
  // 맨 위 8%는 확실히 머리 → 그 폭의 중앙값을 머리 폭으로 본다
  const probe = Math.min(H-1, top + Math.max(2, Math.round(H*0.08)));
  const ws = rows.slice(top, probe+1).map(r=>r.n).filter(Boolean).sort((a,b)=>a-b);
  const headW = ws[Math.floor(ws.length/2)] || 1;
  // 폭이 갑자기 벌어지는 곳 = 어깨선
  let shoulder = -1;
  for (let y=probe; y<H; y++) if (rows[y].n > headW*1.75){ shoulder = y; break; }
  if (shoulder < 0) shoulder = Math.min(H-1, top + Math.round(H*0.28));
  const headH = Math.max(1, shoulder - top);
  const headWmax = Math.max(1, ...rows.slice(top, shoulder+1).map(r=>r.n));
  const face = rows.slice(top, top + Math.max(1, Math.round(headH*0.7))).filter(r=>r.n>0);
  const cx = face.reduce((a,r)=>a+r.cx, 0) / (face.length || 1);
  return {
    topFrac: top/H,
    headFrac: Math.min(0.55, Math.max(0.10, headH/H)),      // 이상치 방어
    headWFrac: Math.min(0.95, Math.max(0.12, headWmax/W)),
    cxFrac: cx/W, aspect: im.width/im.height,
    opaque,                                                  // 1에 가까우면 배경이 안 지워진 사진
    weak: opaque > 0.92
  };
}

const figPending = new Set();
function ensureFig(i){
  const s = S.seminars[i];
  if (!s?.photo || s.fig || figPending.has(s.id)) return;
  figPending.add(s.id);
  measureFigure(s.photo).then(f => {
    figPending.delete(s.id);
    if (f && S.seminars[i] === s){ s.fig = f; layoutPhotos(); }
  }).catch(() => figPending.delete(s.id));
}

function layoutPhotos(){
  poster.querySelectorAll('.pf-card').forEach((card, i) => {
    const s = S.seminars[i], img = card.querySelector('.pf-photo');
    if (!s || !img) return;
    const copy = card.querySelector('.pf-copy');
    let t0 = 0;
    for (let el = copy; el && el !== card; el = el.offsetParent) t0 += el.offsetTop;
    t0 += copy.offsetHeight + (s.gap ?? 30);
    const f = s.fig;
    if (!f){                                   // 아직 측정 전 — 대략 배치하고 측정을 건다
      ensureFig(i);
      img.style.top = t0 + 'px';
      img.style.height = Math.max(80, card.offsetHeight - t0 + 250) + 'px';
      return;
    }
    const byHeight = HEAD_H / f.headFrac;                   // 정수리~어깨선 기준
    const byWidth  = (HEAD_W / f.headWFrac) / f.aspect;      // 머리 폭 기준
    const h = Math.sqrt(byHeight * byWidth) * ((s.size ?? 100) / 100);
    const w = h * f.aspect;
    const cx = s.flip ? 1 - f.cxFrac : f.cxFrac;      // 좌우 반전하면 얼굴 위치도 뒤집힌다
    img.style.height = h + 'px';
    img.style.top = (t0 - f.topFrac * h) + 'px';      // 정수리가 t0에 오도록
    img.style.right = (CARD_W - w * (1 - cx) - (s.hx ?? 585)) + 'px';
    const tag = rail.querySelector('#fig-' + s.id);
    if (tag) tag.innerHTML = f.weak
      ? '<span class="warn">배경이 지워지지 않은 사진 같습니다 — 자동 크기 맞춤이 부정확할 수 있어요. 배경 제거를 켜거나 크기를 직접 맞춰주세요.</span>'
      : `자동 측정 — 얼굴 세로 ${(f.headFrac*100).toFixed(0)}% · 가로 ${(f.headWFrac*100).toFixed(0)}% · 적용 높이 ${Math.round(h)}px`;
  });
}

/* ── rail (controls) ──────────────────────────────────────────────── */
const openSecs = new Set(['sec_theme','sec_sem']);
const openCards = new Set();

function field(label, path, opts={}){
  const v = get(path);
  const tag = opts.area ? 'textarea' : 'input';
  const attrs = opts.area ? `rows="${opts.rows||2}"` : `type="${opts.type||'text'}"${opts.attrs||''}`;
  const head = opts.mark
    ? `<div class="flab"><label for="${path}">${label}</label>
        <button type="button" class="btn sm" data-mark="${path}">✦ 선택 강조</button></div>`
    : `<label for="${path}">${label}</label>`;
  return `<div class="f">${head}
    <${tag} id="${path}" data-k="${path}" ${attrs}>${opts.area?esc(v):''}</${tag}>
    ${opts.hint?`<span class="hint">${opts.hint}</span>`:''}</div>`;
}
function color(label, path){
  const v = get(path);
  return `<div class="f"><label>${label}</label><div class="swatch">
    <input type="color" data-k="${path}" value="${v}" aria-label="${label} 색상 선택">
    <input type="text" data-k="${path}" value="${v}" spellcheck="false" aria-label="${label} 색상 코드"></div></div>`;
}
function get(path){ return path.split('.').reduce((o,k)=> o?.[k], S); }
function flash(el, msg){
  const old = el.textContent;
  el.textContent = msg; el.disabled = true;
  setTimeout(() => { el.textContent = old; el.disabled = false; }, 1400);
}
function set(path, val){
  const ks = path.split('.'), last = ks.pop();
  const o = ks.reduce((o,k)=> o[k], S);
  o[last] = val;
}

function strayHTML(){
  const list = strays();
  if (!list.length) return '';
  const { y, m } = calYM();
  return `<div class="warn">⚠ 아래 세미나는 ${y}년 ${m}월 달력에 표시되지 않습니다. 날짜를 확인하거나 자동 설정을 켜세요.<br>`
    + list.map(o => `· ${o.i+1}번 ${esc(o.x.teacher || o.x.pillName || '세미나')} — ${esc(o.x.date)}`).join('<br>')
    + `</div>`;
}
/* 달력 관련 표시만 제자리에서 갱신 — 입력 중 포커스를 잃지 않도록 */
function refreshCal(){
  const { y, m } = calYM();
  const ym = rail.querySelector('#ymBtn');
  if (ym){
    ym.disabled = S.cal.auto !== false;
    ym.textContent = `${y}년 ${m}월`;
    if (ym.disabled) closeYm();
  }
  const box = rail.querySelector('#calWarn');
  if (box) box.innerHTML = strayHTML();
}
const dateLabel = v => { const d = dparse(v); return d ? `${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}.` : '날짜 선택'; };
let dpFor = null, dpYM = null;
function closeDp(){ rail.querySelectorAll('.dppanel').forEach(p => p.hidden = true); dpFor = null; }
function drawDp(){
  if (!dpFor) return;
  const wrap = rail.querySelector(`[data-dp="${dpFor}"]`); if (!wrap) return;
  const host = wrap.querySelector('.dppanel');
  const { y, m } = dpYM;
  const lead = new Date(y, m-1, 1).getDay();            // 일요일 시작
  const sel = dparse(get(dpFor));
  const cells = Array.from({length:42}, (_,i) => new Date(y, m-1, i - lead + 1));
  host.innerHTML = `
    <div class="yhead"><b>${y}년 ${m}월</b>
      <span class="ynav"><button type="button" data-mstep="-1" aria-label="이전 달">‹</button>
      <button type="button" data-mstep="1" aria-label="다음 달">›</button></span></div>
    <div class="dwk">${WD_KO.map(w=>`<span>${w}</span>`).join('')}</div>
    <div class="dgrid">${cells.map(d => {
      const off = d.getMonth() !== m-1;
      const on = sel && d.getFullYear()===sel.getFullYear() && d.getMonth()===sel.getMonth() && d.getDate()===sel.getDate();
      const iso = `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
      return `<button type="button" data-d="${iso}" class="${off?'off':''}" aria-selected="${on}">${d.getDate()}</button>`;
    }).join('')}</div>
    <div class="yfoot"><button type="button" data-dact="clear">삭제</button>
      <button type="button" data-dact="today">오늘</button></div>`;
}
function afterDateChange(path){
  const dm = path.match(/^seminars\.(\d+)\.date$/);
  if (dm){
    const sem = S.seminars[+dm[1]], d = dparse(sem.date);
    const tag = rail.querySelector(`[data-card="${sem.id}"] .when`);
    if (tag) tag.textContent = d ? `${d.getMonth()+1}.${pad2(d.getDate())} ${WD_EN[d.getDay()]}` : '날짜 미정';
    const btn = rail.querySelector(`[data-dp="${path}"] .dpbtn`);
    if (btn) btn.textContent = dateLabel(sem.date);
  }
  syncMonth(); refreshCal(); renderPoster(); autosave();
}
rail.addEventListener('click', e => {
  const open = e.target.closest('.dpbtn');
  if (open){
    const wrap = open.closest('.dpwrap');
    const already = dpFor === wrap.dataset.dp && !wrap.querySelector('.dppanel').hidden;
    closeDp();
    if (!already){
      dpFor = wrap.dataset.dp;
      const d = dparse(get(dpFor)) || new Date();
      dpYM = { y:d.getFullYear(), m:d.getMonth()+1 };
      wrap.querySelector('.dppanel').hidden = false;
      drawDp();
    }
    return;
  }
  const ms = e.target.closest('[data-mstep]');
  if (ms){
    let { y, m } = dpYM; m += +ms.dataset.mstep;
    if (m < 1){ m = 12; y--; } if (m > 12){ m = 1; y++; }
    dpYM = { y, m }; drawDp(); return;
  }
  const day = e.target.closest('[data-d]');
  if (day){ const path = dpFor; set(path, day.dataset.d); closeDp(); afterDateChange(path); return; }
  const da = e.target.closest('[data-dact]');
  if (da){
    const path = dpFor;
    if (da.dataset.dact === 'clear') set(path, '');
    else { const n = new Date(); set(path, `${n.getFullYear()}-${pad2(n.getMonth()+1)}-${pad2(n.getDate())}`); }
    closeDp(); afterDateChange(path); return;
  }
  if (!e.target.closest('.dppanel')) closeDp();
});

let ymOpenYear = null;
function closeYm(){ const p = rail.querySelector('#ymPanel'); if (p) p.hidden = true; ymOpenYear = null; }
function drawYm(){
  const p = rail.querySelector('#ymPanel'); if (!p || p.hidden) return;
  const cur = calYM();
  const y = ymOpenYear ?? cur.y;
  p.innerHTML = `
    <div class="yhead"><b>${y}년</b>
      <span class="ynav"><button type="button" data-ystep="-1" aria-label="이전 해">‹</button>
      <button type="button" data-ystep="1" aria-label="다음 해">›</button></span></div>
    <div class="ygrid">${Array.from({length:12},(_,i)=>
      `<button type="button" data-ym="${y}-${pad2(i+1)}" aria-selected="${y===cur.y && i+1===cur.m}">${i+1}월</button>`).join('')}</div>
    <div class="yfoot"><button type="button" data-yact="auto">자동으로</button>
      <button type="button" data-yact="now">이번 달</button></div>`;

rail.addEventListener('click', e => {
  const btn = e.target.closest('#ymBtn');
  if (btn && !btn.disabled){
    const p = rail.querySelector('#ymPanel');
    p.hidden = !p.hidden;
    ymOpenYear = p.hidden ? null : calYM().y;
    drawYm();
    return;
  }
  const step = e.target.closest('[data-ystep]');
  if (step){ ymOpenYear = (ymOpenYear ?? calYM().y) + (+step.dataset.ystep); drawYm(); return; }
  const cell = e.target.closest('[data-ym]');
  if (cell){
    S.cal.ym = cell.dataset.ym;
    closeYm(); syncMonth(); refreshCal(); renderPoster(); autosave();
    return;
  }
  const act = e.target.closest('[data-yact]');
  if (act){
    if (act.dataset.yact === 'auto'){
      S.cal.auto = true;
      const cb = rail.querySelector('[data-k="cal.auto"]'); if (cb) cb.checked = true;
    } else {
      const n = new Date();
      S.cal.ym = `${n.getFullYear()}-${pad2(n.getMonth()+1)}`;
    }
    closeYm(); syncMonth(); refreshCal(); renderPoster(); autosave();
    return;
  }
  if (!e.target.closest('#ymPanel')) closeYm();
});
addEventListener('keydown', e => { if (e.key === 'Escape'){ closeYm(); closeDp(); } });

let lastM = null;
function syncMonth(){
  const { m } = calYM();
  if (m === lastM) return;
  lastM = m;
  if (/^\d+월 세미나 일정 한눈에 보기$/.test(S.cal.title)) S.cal.title = m + '월 세미나 일정 한눈에 보기';
  S.hero.kicker = String(S.hero.kicker).replace(/\*\d+월\*/, '*' + m + '월*');
  rail.querySelectorAll('[data-k="cal.title"],[data-k="hero.kicker"]').forEach(o => o.value = get(o.dataset.k));
}

rail.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.cut !== undefined){
    const i = +el.dataset.cut;
    S.seminars[i][el.dataset.f] = +el.value;
    el.nextElementSibling && (el.nextElementSibling.value = el.value);
    queueCut(i);
    return;
  }
  if (!el.dataset.k) return;
  const path = el.dataset.k;
  let v = el.type === 'checkbox' ? el.checked : el.value;
  if (el.type === 'number' || el.type === 'range') v = +v;
  set(path, v);
  if (el.type === 'range' && el.nextElementSibling) el.nextElementSibling.value = v;
  // colour twins stay in sync
  if (el.type === 'color' || (el.type === 'text' && /^#[0-9a-f]{6}$/i.test(String(v)))){
    rail.querySelectorAll(`[data-k="${path}"]`).forEach(o => { if (o !== el) o.value = v; });
  }
  if (path.endsWith('.cut')){ renderRail(); queueCut(+path.split('.')[1]); }
  const dm = path.match(/^seminars\.(\d+)\.date$/);
  if (dm){
    const sem = S.seminars[+dm[1]], d = dparse(sem.date);
    const tag = rail.querySelector(`[data-card="${sem.id}"] .when`);

  if (dm || path === 'cal.auto' || path === 'cal.ym'){ syncMonth(); refreshCal(); }
  renderPoster(); autosave();
});

  else if (act === 'delLast'){ S.seminars.pop(); }
  else if (act === 'dup'){

    c.id = 's' + Math.random().toString(36).slice(2,8);

  else if (act === 'down'){ S.seminars.splice(i+1, 0, S.seminars.splice(i,1)[0]); }

/* ── photo pipeline: downscale → optional background cut ──────────── */
const MAXW = 760, MAXH = 1100;
/* 혜택 왼쪽 그림 교체 — 쿠폰 일러스트 대신 직접 올린 이미지를 쓴다 */
async function loadBenImg(i, file){
  if (!file.type.startsWith('image/')){ alert('이미지 파일만 올릴 수 있습니다.'); return; }
  const url = await new Promise(r => { const fr = new FileReader(); fr.onload = ()=>r(fr.result); fr.readAsDataURL(file); });
  const im = await loadImage(url);
  const sc = Math.min(1, 720/im.width, 720/im.height);
  const c = document.createElement('canvas');
  c.width = Math.round(im.width*sc); c.height = Math.round(im.height*sc);
  c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
  S.ben.items[i].img = compact(c);
  renderRail(); renderPoster(); autosave();
}
function loadImage(src){
  return new Promise((res,rej) => { const im = new Image(); im.onload = ()=>res(im); im.onerror = rej; im.src = src; });
}
async function loadPhoto(i, file){
  if (!file.type.startsWith('image/')){ alert('이미지 파일만 올릴 수 있습니다.'); return; }
  const url = await new Promise(r => { const fr = new FileReader(); fr.onload = ()=>r(fr.result); fr.readAsDataURL(file); });
  const im = await loadImage(url);
  const sc = Math.min(1, MAXW/im.width, MAXH/im.height);
  const c = document.createElement('canvas');
  c.width = Math.round(im.width*sc); c.height = Math.round(im.height*sc);
  c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
  const s = S.seminars[i];
  s.raw = compact(c);
  s.fig = null;
  s.cut = true;                                   // background removal on by default
  s.photo = s.raw;
  renderRail(); renderPoster();
  await runCut(i);
}

/* WebP keeps alpha and is ~8x smaller than PNG — matters for localStorage */
function compact(canvas){
  const w = canvas.toDataURL('image/webp', 0.86);
  return w.startsWith('data:image/webp') ? w : canvas.toDataURL('image/png');
}

const cutTimers = {};
function queueCut(i){
  clearTimeout(cutTimers[i]);
  cutTimers[i] = setTimeout(()=>runCut(i), 160);
}
async function runCut(i){
  const s = S.seminars[i];
  if (!s.raw){ return; }
  if (!s.cut){ s.photo = s.raw; s.fig = null; renderPoster(); autosave(); return; }
  const im = await loadImage(s.raw);
  const c = document.createElement('canvas');
  c.width = im.width; c.height = im.height;
  const ctx = c.getContext('2d', { willReadFrequently:true });
  ctx.drawImage(im, 0, 0);
  const data = ctx.getImageData(0, 0, c.width, c.height);
  const kept = cutout(data, s.tol, s.feather);
  ctx.putImageData(data, 0, 0);
  s.photo = c.toDataURL('image/png');
  s.fig = null;
  renderPoster(); autosave();
  const box = rail.querySelector(`[data-card="${s.id}"] .thumb .pic img`);
  if (box) box.src = s.photo;
  const warnId = 'warn-' + s.id;
  document.getElementById(warnId)?.remove();
  if (kept < 0.12 || kept > 0.97){
    const host = rail.querySelector(`[data-card="${s.id}"] .thumb`);
    if (host){
      const w = document.createElement('div');
      w.id = warnId; w.className = 'warn';
      w.textContent = kept < 0.12
        ? '인물까지 지워졌습니다. 제거 강도를 낮춰보세요.'
        : '배경이 거의 지워지지 않았습니다. 강도를 높이거나 단색 배경 사진을 써주세요.';
      host.after(w);
    }
  }
}

/* flood-fill from the border; tolerant to studio gradients via a local test */
function cutout(imgData, tol, feather){
  const { data, width:w, height:h } = imgData;
  const n = w*h;
  const seen = new Uint8Array(n);
  const removed = new Uint8Array(n);
  const q = new Int32Array(n);
  let qs = 0, qe = 0;

  // reference background = average of the border ring
  let sr=0, sg=0, sb=0, cnt=0;
  const sample = idx => { sr+=data[idx*4]; sg+=data[idx*4+1]; sb+=data[idx*4+2]; cnt++; };
  for (let x=0; x<w; x++){ sample(x); sample((h-1)*w + x); }
  for (let y=0; y<h; y++){ sample(y*w); sample(y*w + w-1); }
  const R = sr/cnt, G = sg/cnt, B = sb/cnt;

  const T  = tol * 2.2;          // distance to the reference colour
  const TL = tol * 1.1;          // distance to the neighbour already removed
  const T2 = T * 1.7;            // outer band → partial alpha
  const dist = (i, r, g, b) => {
    const dr = data[i*4]-r, dg = data[i*4+1]-g, db = data[i*4+2]-b;
    return Math.sqrt(dr*dr + dg*dg + db*db);
  };

  const push = i => { if (!seen[i]){ seen[i]=1; q[qe++]=i; } };
  for (let x=0; x<w; x++){ push(x); push((h-1)*w + x); }
  for (let y=0; y<h; y++){ push(y*w); push(y*w + w-1); }

  while (qs < qe){
    const i = q[qs++];
    if (data[i*4+3] === 0){ removed[i] = 1; }
    else {
      const dRef = dist(i, R, G, B);
      if (dRef > T2) continue;                       // solidly foreground — stop here
      removed[i] = dRef <= T ? 1 : 2;                // 2 = soft band
    }
    const x = i % w, y = (i - x)/w;
    if (x > 0)   maybe(i-1, i);
    if (x < w-1) maybe(i+1, i);
    if (y > 0)   maybe(i-w, i);
    if (y < h-1) maybe(i+w, i);
  }
  function maybe(j, from){
    if (seen[j]) return;
    if (data[j*4+3] === 0){ seen[j]=1; q[qe++]=j; return; }
    const dRef = dist(j, R, G, B);
    const dLoc = dist(j, data[from*4], data[from*4+1], data[from*4+2]);
    if (dRef <= T || (dLoc <= TL && dRef <= T2)){ seen[j]=1; q[qe++]=j; }
  }

  // alpha + feather
  const alpha = new Float32Array(n);
  for (let i=0; i<n; i++) alpha[i] = removed[i] === 1 ? 0 : removed[i] === 2 ? 0.45 : 1;
  const out = feather > 0 ? blur(alpha, w, h, feather) : alpha;
  let keptPx = 0;
  for (let i=0; i<n; i++){
    const a = Math.max(0, Math.min(1, out[i]));
    data[i*4+3] = Math.round(data[i*4+3] * a);
    if (a > .5) keptPx++;
  }
  return keptPx / n;
}
function blur(src, w, h, r){
  const tmp = new Float32Array(src.length), out = new Float32Array(src.length), d = r*2+1;
  for (let y=0; y<h; y++){
    let sum = 0;
    for (let x=-r; x<=r; x++) sum += src[y*w + Math.min(w-1, Math.max(0,x))];
    for (let x=0; x<w; x++){
      tmp[y*w+x] = sum/d;
      sum += src[y*w + Math.min(w-1, x+r+1)] - src[y*w + Math.max(0, x-r)];
    }
  }
  for (let x=0; x<w; x++){
    let sum = 0;
    for (let y=-r; y<=r; y++) sum += tmp[Math.min(h-1, Math.max(0,y))*w + x];
    for (let y=0; y<h; y++){
      out[y*w+x] = sum/d;
      sum += tmp[Math.min(h-1, y+r+1)*w + x] - tmp[Math.max(0, y-r)*w + x];
    }
  }
  return out;
}

/* ── zoom / navigation ────────────────────────────────────────────── */
const stageScroll = document.getElementById('stageScroll');
let zoom = 0.4;
function applyZoom(){
  for (const [el, child] of [[holder, poster], [bnHolder, banners]]){
    el.style.transform = `scale(${zoom})`;
    el.style.height = (child.offsetHeight * zoom) + 'px';
    el.style.width = ((el === holder ? 815 : 1060) * zoom) + 'px';
  }
  zVal.textContent = Math.round(zoom*100) + '%';
}
let autoFit = true;
let mode = 'poster';
const stageW = () => mode === 'banner' ? 1060 : 815;
function fit(){
  const avail = stageScroll.clientWidth - 48;
  if (avail > 0) zoom = Math.max(.12, Math.min(1, avail/stageW()));
  autoFit = true;
  applyZoom();
}
function setMode(m){
  mode = m;
  const onBanner = m === 'banner';
  holder.hidden = onBanner; bnHolder.hidden = !onBanner;
  jump.style.display = onBanner ? 'none' : '';
  modePoster.ariaPressed = String(!onBanner);
  modeBanner.ariaPressed = String(onBanner);
  stageScroll.scrollTop = 0;
  fit();
}
modePoster.onclick = () => setMode('poster');
modeBanner.onclick = () => setMode('banner');
zIn.onclick  = () => { autoFit = false; zoom = Math.min(1.5, zoom + .1); applyZoom(); };
zOut.onclick = () => { autoFit = false; zoom = Math.max(.12, zoom - .1); applyZoom(); };
zFit.onclick = fit;
/* the rail and the window both change how much room the stage has */
new ResizeObserver(() => { autoFit ? fit() : applyZoom(); }).observe(stageScroll);
jump.onclick = e => {
  const to = e.target.dataset?.to; if (!to) return;
  const el = document.getElementById('sec-' + to); if (!el) return;
  stageScroll.scrollTo({ top: el.offsetTop * zoom, behavior:'smooth' });
};
addEventListener('resize', () => { autoFit ? fit() : applyZoom(); });

/* mobile tabs */
tabPrev.onclick = () => { stage.hidden = false; rail.hidden = true;  tabPrev.ariaPressed='true';  tabEdit.ariaPressed='false'; fit(); };
tabEdit.onclick = () => { stage.hidden = true;  rail.hidden = false; tabPrev.ariaPressed='false'; tabEdit.ariaPressed='true'; };

/* ── persistence ──────────────────────────────────────────────────── */
const KEY = 'honkang-seminar-builder';
let saveTimer;
function autosave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      const slim = JSON.parse(JSON.stringify(S));
      slim.seminars.forEach(s => { s.photo = null; s.fig = null; });   // photo/fig are derived from raw
      localStorage.setItem(KEY, JSON.stringify(slim));
      flag('저장됨 ' + new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}), true);
    } catch(err){
      const quota = err && /quota|exceed/i.test(err.name + ' ' + err.message);
      flag(quota ? '자동 저장 실패 — 사진 용량 초과' : '자동 저장 불가 — 설정 저장을 눌러 파일로 보관하세요', false);
    }
  }, 500);
}
function flag(msg, ok){ saved.textContent = msg; saved.classList.toggle('on', !!ok); }

async function hydrate(obj){
  const base = defaults();
  S = Object.assign(base, obj);
  // a saved document replaces whole sub-objects, so re-fill keys added since it was written
  for (const k of ['theme','hero','cal','detail','ben','reg','foot','bn'])
    S[k] = Object.assign(base[k] ?? {}, obj?.[k] ?? {});
  if (S.cal.year || S.cal.month){                     // pre-auto documents
    S.cal.ym = `${S.cal.year || 2026}-${pad2(S.cal.month || 10)}`;
    if (S.cal.auto === undefined) S.cal.auto = true;
    delete S.cal.year; delete S.cal.month;
  }
  if (S.hero && S.hero.accent){                       // pre-marker documents
    S.hero.kicker = `${S.hero.kicker} *${S.hero.accent}*`.trim();
    delete S.hero.accent;
  }
  S.seminars = (obj.seminars?.length ? obj.seminars : defaults().seminars).map(s => seminar(s));
  S.hero.kicker = fixMarks(S.hero.kicker);
  S.seminars.forEach(x => { x.title = fixMarks(x.title); });
  lastM = calYM().m;                                  // don't rewrite a loaded document on open
  renderRail(); renderPoster();
  for (let i=0; i<S.seminars.length; i++) if (S.seminars[i].raw) await runCut(i);
  applyZoom();
}

/* ── export ───────────────────────────────────────────────────────── */
function dataURLtoBlob(u){
  const [head, b64] = u.split(',');
  const mime = head.match(/:(.*?);/)[1];
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for (let i=0; i<bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}
let dlNs, dlProbed = false;
async function downloads(){
  if (dlProbed) return dlNs;
  dlProbed = true;
  try { dlNs = (await window.claude?.use?.('downloads')) || null; } catch { dlNs = null; }
  return dlNs;
}
/* returns true when the file reached the viewer (or they chose not to take it) */
async function saveFile(blob, name){
  const ns = await downloads();
  if (ns){
    try { await ns.save({ filename:name, data:blob }); return true; }
    catch (err){ return err?.code === 'declined'; }
  }
  return tryDownload(blob, name);
}
function tryDownload(blob, name){
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    return true;
  } catch { return false; }
}
function openModal(title, html){
  mTitle.textContent = title; mBody.innerHTML = html; modal.hidden = false;
}
mClose.onclick = () => { modal.hidden = true; mBody.innerHTML = ''; };
modal.addEventListener('click', e => { if (e.target === modal) mClose.onclick(); });
addEventListener('keydown', e => { if (e.key === 'Escape' && !modal.hidden) mClose.onclick(); });

    <div class="addbar">
      <button class="btn primary" id="expAll">상세페이지 전체 1장</button>
      <button class="btn" id="expSec">상세페이지 섹션별</button>
      <button class="btn" id="expBn">배너 7종</button>
    </div>

    이미지가 아니라 실제 텍스트라 확대해도 깨지지 않고 복사·검색이 됩니다.

/* 상세페이지를 스타일까지 담은 단일 HTML 파일로 저장한다.
   사진·SVG는 이미 data URI라 파일 하나로 완결된다(폰트만 외부). */
async function exportHtml(){
  const out = document.getElementById('expOut');
  const ym = calYM();
  const name = `혼강세미나_${ym.y}${pad2(ym.m)}_상세페이지.html`;
  try {
    const css = document.querySelector('style').textContent;
    const links = [...document.querySelectorAll('link[rel="stylesheet"],link[rel="preconnect"]')]
      .map(l => l.outerHTML).join('\n');
    const doc = `<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>혼강 세미나 ${ym.y}년 ${ym.m}월</title>
${links}
<style>
${css}
html,body{margin:0;background:#FFFFFF}
body{display:flex;justify-content:center}
.pf{box-shadow:none}
</style>
</head>
<body>
${poster.outerHTML}
</body>
</html>`;
    const blob = new Blob([doc], { type:'text/html;charset=utf-8' });
    const ok = await saveFile(blob, name);
    out.innerHTML = `<p>${ok ? '' : '자동 저장이 막혀 있습니다. '}<b>${esc(name)}</b> · ${Math.round(blob.size/1024)}KB<br>
      브라우저로 열면 그대로 보이고, 웹 편집기에는 파일 내용을 붙여넣으면 됩니다.</p>`;
  } catch (err){
    out.innerHTML = `<p class="warn">HTML을 만들지 못했습니다: ${esc(err.message||err)}</p>`;
  }
}

async function shoot(targets, isBanner){
  const out = document.getElementById('expOut');
  out.innerHTML = '<p>렌더링 중… 잠시만 기다려 주세요.</p>';
  const prev = holder.style.transform, prevB = bnHolder.style.transform;
  const wasHidden = bnHolder.hidden;
  if (isBanner) bnHolder.hidden = false;            // 숨겨진 요소는 렌더되지 않는다
  holder.style.transform = 'scale(1)';              // html2canvas must see the real size
  bnHolder.style.transform = 'scale(1)';
  const shots = [];
  if (typeof html2canvas !== 'function'){
    out.innerHTML = '<p class="warn">이미지 변환 라이브러리를 불러오지 못했습니다. 네트워크가 막힌 환경이라면 이 HTML 파일을 로컬에서 열어 다시 시도해 주세요.</p>';
    holder.style.transform = prev; return;
  }
  try {
    for (const t of targets){
      const canvas = await html2canvas(t.el, {
        backgroundColor: t.alpha ? null : '#ffffff', scale:1, useCORS:true, logging:false });
      const url = canvas.toDataURL('image/png');
      const ym = calYM();
      shots.push({ url, name: isBanner ? `${ym.y}${pad2(ym.m)}_${t.name}.png`
                                        : `혼강세미나_${ym.y}${pad2(ym.m)}_${t.name}.png`,
                   w:canvas.width, h:canvas.height });
    }
  } catch (err){
    out.innerHTML = `<p class="warn">렌더링에 실패했습니다: ${esc(err.message||err)}</p>`;
    holder.style.transform = prev; bnHolder.style.transform = prevB; bnHolder.hidden = wasHidden; return;
  }
  holder.style.transform = prev; bnHolder.style.transform = prevB; bnHolder.hidden = wasHidden;
  let blocked = false;
  for (const s of shots){
    if (!(await saveFile(dataURLtoBlob(s.url), s.name))) blocked = true;
  }
  out.innerHTML = `
    <p>${shots.length}장 생성했습니다.${blocked ? ' 자동 저장이 막혀 있으니 아래 이미지를 <b>우클릭 → 이미지를 다른 이름으로 저장</b>하세요.' : ' 저장 창에서 확인해 주세요.'}</p>
    <div class="shots">${shots.map(s=>`<figure class="shot"><img src="${s.url}" alt="${esc(s.name)}">
      <figcaption class="cap">${esc(s.name)} · ${s.w}×${s.h}</figcaption></figure>`).join('')}</div>`;
}

/* ── boot ─────────────────────────────────────────────────────────── */
(async function boot(){
  let saved0 = null;
  try { saved0 = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch {}
  await hydrate(saved0 && saved0.v === 3 ? saved0 : defaults());
  requestAnimationFrame(() => requestAnimationFrame(fit));
  document.fonts?.ready.then(fit);
  if (innerWidth <= 900){ rail.hidden = true; }
})();
